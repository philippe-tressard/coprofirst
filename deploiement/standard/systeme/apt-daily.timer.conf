# Posé par deploiement/standard/correctifs-systeme.sh dans
# /etc/systemd/system/apt-daily.timer.d/ — ne pas éditer à la main.
#
# Les listes de paquets se rafraîchissent à 02:30, avant le passage de 03:00.
# Pas de rattrapage au démarrage (Persistent=false) : un serveur rallumé à 04:40
# lancerait sinon le passage pendant la mise à jour de CoproFirst. Une nuit
# manquée se rattrape la suivante, et le contrôle quotidien la voit.
[Timer]
OnCalendar=
OnCalendar=*-*-* 02:30
RandomizedDelaySec=15min
Persistent=false
