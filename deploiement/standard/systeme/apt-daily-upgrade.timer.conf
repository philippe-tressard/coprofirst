# Posé par deploiement/standard/correctifs-systeme.sh dans
# /etc/systemd/system/apt-daily-upgrade.timer.d/ — ne pas éditer à la main.
#
# Le passage d'unattended-upgrades : entre 03:00 et 03:20. Une mise à jour de
# Docker redémarre les conteneurs ; elle ne doit pas tomber entre 04:30 et 05:30
# (mise à jour de CoproFirst, remise à zéro de la démo). Pas de rattrapage au
# démarrage, pour la même raison (Persistent=false).
[Timer]
OnCalendar=
OnCalendar=*-*-* 03:00
RandomizedDelaySec=20min
Persistent=false
