# =============================================================================
#  Installation standard de CoproFirst — les images, jamais un build
#  (#1755, 08/10/2026 ; spec `specs/architecture/multi-coproprietes.md` §4.10)
#
#  S'emploie PAR-DESSUS le `docker-compose.yml` de la racine, qui reste la seule
#  description des services (volumes, ports, variables, délais d'arrêt) :
#
#      docker compose -f docker-compose.yml -f deploiement/standard/compose.images.yml up -d
#
#  Ce fichier ne dit qu'une chose : chaque service vient de l'image publiée par
#  la CI (`.github/workflows/images.yml`) pour la version `COPROFIRST_VERSION`,
#  et ne se construit pas. Le mode d'emploi : `deploiement/standard/LISEZMOI.md`.
#
#  `!reset` retire la section `build` héritée (Compose ≥ 2.24) : sans lui, une
#  image introuvable serait CONSTRUITE en silence sur la machine — l'inverse de
#  ce que l'installation promet.
#
#  🔒 `api/tests/test_deploiement_standard.py` : un service construit par la
#  racine et oublié ici, ou une image qui ne serait pas celle que la CI publie,
#  font échouer la CI.
# =============================================================================

services:
  caddy:
    build: !reset null
    image: ghcr.io/philippe-tressard/coprofirst-caddy:${COPROFIRST_VERSION:?COPROFIRST_VERSION manquante dans .env}
    pull_policy: missing

  front:
    build: !reset null
    image: ghcr.io/philippe-tressard/coprofirst-front:${COPROFIRST_VERSION:?COPROFIRST_VERSION manquante dans .env}
    pull_policy: missing

  api:
    build: !reset null
    # Une installation standard EST une réplique (#1761) : le rôle ne dépend pas
    # d'un `.env` qu'on aurait oublié de compléter.
    environment:
      - ROLE_INSTALLATION=replique
    image: ghcr.io/philippe-tressard/coprofirst-api:${COPROFIRST_VERSION:?COPROFIRST_VERSION manquante dans .env}
    pull_policy: missing

  whatsapp-bridge:
    build: !reset null
    image: ghcr.io/philippe-tressard/coprofirst-whatsapp-bridge:${COPROFIRST_VERSION:?COPROFIRST_VERSION manquante dans .env}
    pull_policy: missing

  #  PostgreSQL, s'il est allumé (`COMPOSE_PROFILES=postgresql`) : l'image
  #  officielle, pas une image de la CI. Une réplique n'a pas de second nœud —
  #  ni réplication, ni port sur le réseau local, ni le pg_hba de la référence (qui
  #  nomme ses deux RPi), ni son script de rôle de réplication.
  postgres:
    volumes: !override
      - pg_data:/var/lib/postgresql/data
      - ./deploiement/standard/postgresql/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    ports: !reset []
