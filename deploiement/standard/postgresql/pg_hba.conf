# =============================================================================
#  pg_hba.conf d'une RÉPLIQUE CoproFirst (#1756, DI-4 sous PostgreSQL)
#
#  Une réplique tient sur UN serveur (D15) : ni second nœud, ni rôle de
#  réplication, ni accès depuis le réseau local. Seuls les conteneurs du réseau
#  de Compose (l'API) se connectent, par mot de passe. Celui de la référence —
#  `infra/postgresql/pg_hba.conf` — ouvre en plus la réplication à l'autre RPi.
#
#  ⚠️ 172.16.0.0/12 couvre les réseaux que Docker attribue par défaut. Un démon
#  configuré avec d'autres plages (`default-address-pools`) doit l'ajouter ici.
# =============================================================================
local   all   all                    trust
host    all   all   172.16.0.0/12    scram-sha-256
host    all   all   127.0.0.1/32     scram-sha-256
