# =============================================================================
#  Installation COMMUNE à plusieurs copropriétés — la surcouche (#2053)
#
#  Se pose APRÈS celle des images, sur une installation commune seulement :
#
#      docker compose -f docker-compose.yml \
#          -f deploiement/standard/compose.images.yml \
#          -f deploiement/standard/commune/compose.commune.yml up -d
#
#  Elle ne dit qu'une chose : le front ne connaît pas UNE adresse, il sert celle
#  que le visiteur a demandée. Le reste — déclaration, garde des pages, gestes de
#  l'hébergeur — est dans `LISEZMOI.md`, à côté.
# =============================================================================

services:
  front:
    environment:
      #  Le front ne fixe aucune adresse (SvelteKit 3 : plus d'`ORIGIN`, #2205) :
      #  adapter-node lit l'hôte dans la requête — celui que Caddy transmet tel quel,
      #  le même que l'API lit pour résoudre la copropriété (§4.1). Une adresse figée
      #  ferait demander sa configuration à l'hôte commun pour toutes (421).
      - HOST_HEADER=host
      #  Le schéma vient du proxy de confiance (tunnel, `trusted_proxies` du
      #  Caddyfile) ; sans l'en-tête, adapter-node suppose `https`.
      - PROTOCOL_HEADER=x-forwarded-proto
