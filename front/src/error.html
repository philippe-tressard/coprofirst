<!doctype html>
<!--
  L'erreur FATALE (#2304) : celle que SvelteKit rend quand la page d'erreur
  elle-même ne peut pas l'être (le squelette racine a échoué). Elle se suffit :
  ni feuille du site, ni script, ni image. Les couleurs sont celles du système
  (`Canvas`, `CanvasText`), lisibles au clair comme au sombre sans jeton.
  Le message de l'erreur n'est pas montré : seul le statut. La page d'erreur
  ordinaire est `routes/+error.svelte`.
-->
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Erreur %sveltekit.status%</title>
		<style>
			:root {
				color-scheme: light dark;
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 1rem;
				box-sizing: border-box;
				background: Canvas;
				color: CanvasText;
				font-family: system-ui, sans-serif;
				text-align: center;
				line-height: 1.6;
			}
			main {
				max-width: 400px;
			}
			h1 {
				font-size: 1.5rem;
				margin: 0 0 0.5rem;
			}
			a {
				color: LinkText;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>Le site n’a pas pu s’afficher</h1>
			<p>Réessayez dans un instant. Si l’erreur persiste, prévenez le gestionnaire du site.</p>
			<p><a href="/">Retour à l’accueil</a></p>
			<p><small>Erreur %sveltekit.status%</small></p>
		</main>
	</body>
</html>
