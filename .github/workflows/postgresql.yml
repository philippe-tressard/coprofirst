name: PostgreSQL

#  Lot P2-5 (#1747) — chantier multi-copropriétés, D4 : PostgreSQL, seul moteur.
#
#  Rejoue TOUTE la suite pytest sur PostgreSQL (`TESTS_BASE_URL`, un schéma neuf
#  par base de test, `tests/aides_base`) pour ce qui vise `main` — PR et push.
#  Les PR vers `dev` la jouent dans « Tests Python (pytest) » (`ci.yml`), par le
#  même script : chaque événement la joue UNE fois (🔒
#  test_suite_postgresql_une_fois.py). Les deux noms de job sont des checks
#  REQUIS de `main` : ni l'un ni l'autre ne se renomme sans la protection.
#
#  Un job qui n'a pas pu rejouer la suite (pytest interrompu, base injoignable)
#  rend toujours l'échec : INCONNU, jamais OK (`standards/04` §1).
#
#  La suite tourne en parallèle (`pytest -n`, #2223), dans un ordre tiré au sort
#  dont la graine est au résumé : un schéma par test, et les cœurs de l'exécuteur
#  (le nombre de workers : `workers_suite` dans le script).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  mesure:
    name: Suite pytest sur PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        #  L'étiquette de la PRODUCTION (docker-compose.yml), pas `17` flottant :
        #  la suite juge le serveur que les nœuds font tourner. Dependabot
        #  (`docker-compose`) monte le compose ; cette ligne suit dans la même PR,
        #  🔒 test_images_compose_suivies.py (#1872).
        image: postgres:17.11
        env:
          POSTGRES_USER: essai
          POSTGRES_PASSWORD: essai
          POSTGRES_DB: essai
          #  Comme en production (docker-compose.yml) : l'intégrité s'y mesure.
          POSTGRES_INITDB_ARGS: --data-checksums
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U essai" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      #  Le même rendu PDF que le job pytest de la CI : sans elles, les tests de
      #  rendu échouent ici et nulle part ailleurs (`scripts/ci/bibliotheques-pdf.sh`).
      - name: Bibliothèques système pour le rendu PDF
        run: bash scripts/ci/bibliotheques-pdf.sh

      - name: Install dependencies
        working-directory: api
        run: pip install -r requirements-dev.txt

      - name: Rejouer la suite sur PostgreSQL
        working-directory: api
        env:
          TESTS_BASE_URL: postgresql+psycopg://essai:essai@localhost:5432/essai
        run: bash ../scripts/ci/mesure-postgresql.sh
