      - name: Tout --selftest exposé est lancé par ce job
        # `check-ci-complete.mjs` transposé aux scripts d'infra (#1574, famille
        # #409/#410/#411/#561) : un self-test écrit, juste, vert quand on le
        # tape, et qu'aucune ligne de l'étape précédente n'exécute. Les
        # exposeurs sont lus à la forme du geste (`= "--selftest"` non commenté),
        # et une exception se déclare avec sa raison dans le script.
        run: bash scripts/poste/verifier-selftests-branches.sh

      - name: Variables non assignées sous `set -u`
        # 🔴 DEUX fois un script d'infra est mort à l'exécution sur une variable
        # jamais définie, et DEUX fois cette CI était verte :
        #   • 11/08/2026 — `check-reliability.sh`, `$R` sorti des quotes ;
        #   • 06/09/2026 — `export-hors-site.sh`, `RPI1_IP` qui n'a jamais
        #     existé : le rattrapage de #775 n'a donc JAMAIS tourné, et c'est
        #     en lançant le script qu'on l'a su, pas par un contrôle.
        # `bash -n` valide la syntaxe, pas l'existence d'un nom ; et un
        # `--selftest` placé avant le code réel rend la main sans le payer.
        # ShellCheck ne couvre pas ce cas : SC2154 s'abstient sur les noms tout
        # en majuscules — la convention de nommage de TOUS les scripts d'ici.
        run: python scripts/poste/verifier-variables-shell.py

      - name: Contrats d'infra (logs rotés, chemins de sortie datés)
        # Deux régressions vécues le 31/07/2026, toutes deux invisibles pendant
        # des semaines parce qu'un manque ressemble à du calme :
        #   • un log ajouté hors du motif roté par maintenance.sh grossit sans
        #     fin (hostachy-reliability.log : 1,7 Mo, jamais roté) ;
        #   • un chemin de sortie muet dans auto-deploy.sh fait croire au
        #     contrôle de battement que le script est mort.
        # Ces deux contrats sont statiques : ils se vérifient sans les RPi. Le
        # second vit depuis #1587 dans `lib-journal.sh` (`contrat_journal`),
        # lancé par l'étape des self-tests avec ses cas fautifs : il lisait ici
        # `$LOG_DATE`, la variable figée au démarrage que #1587 a retirée.
        run: |
          st=0
          for f in $(git ls-files -- '*.sh'); do
            for p in $(grep -oE '/var/log/[A-Za-z0-9_.*-]+' "$f" | sort -u); do
              case "$p" in
                /var/log/hostachy-*.log) ;;
                #  Le journal d'accès VIT DANS le conteneur Caddy (#1588) : Caddy le
                #  roule lui-même (`roll_size`, `roll_keep`, `roll_keep_for` du
                #  Caddyfile) — maintenance.sh n'y touche pas, et ne le doit pas.
                #  Déclarée : l'exception échoue plus bas si le script cesse de la citer.
                /var/log/caddy) ;;
                *) echo "::error file=$f::$p hors du motif /var/log/hostachy-*.log — maintenance.sh ne le rotera jamais"; st=1 ;;
              esac
            done
          done
          grep -q '/var/log/caddy' scripts/lib/lib-journal-acces.sh \
            || { echo "::error file=.github/workflows/ci.yml::l'exception /var/log/caddy ne sert plus (lib-journal-acces.sh ne la cite plus) — la retirer"; st=1; }
          grep -q 'for LOGFILE in /var/log/hostachy-\*\.log' scripts/exploitation/maintenance.sh \
            || { echo "::error file=scripts/exploitation/maintenance.sh::la rotation doit itérer sur le GLOB /var/log/hostachy-*.log (une liste nominative laisse filer tout log ajouté ensuite)"; st=1; }
          for f in $(git ls-files -- '*.sh'); do
            while IFS= read -r hit; do
              case "$hit" in
                *"label=com.docker.compose.project"*) ;;
                *) echo "::error file=$f::\`docker image prune\` sans --filter label=com.docker.compose.project — le daemon de rpi2 est partagé avec List-dons, un prune nu supprime aussi ses couches"; st=1 ;;
              esac
            done < <(grep -nE '^[^#]*docker image prune' "$f")
            grep -qE '^[^#]*docker system prune' "$f" \
              && { echo "::error file=$f::\`docker system prune\` est interdit — il détruirait volumes et réseaux de l'application co-hébergée"; st=1; }
          done
          # 🔴 Le moteur d'envoi d'e-mail vit dans lib-alert.sh, et NULLE PART
          # ailleurs. `bascule.sh` a gardé le sien jusqu'au 30/08/2026 — trente
          # lignes de smtplib recopiées, et pire : envoyées par `docker exec
          # hostachy_api`, donc par un conteneur que sa propre phase 2 arrête.
          # L'alerte de bascule échouée ne partait donc pas dans le seul cas où
          # elle compte : quand le rollback n'a pas su relancer les conteneurs.
          # Rien ne le disait — c'est une duplication qu'aucun contrôle ne
          # voyait, et ce lot en est la troisième dans ce dépôt (moteur d'envoi
          # du monitoring, v2.41.0).
          for f in $(git ls-files -- 'scripts/*.sh'); do
            case "$f" in scripts/lib/lib-alert.sh) continue ;; esac
            grep -qE '^[^#]*(smtplib|MIMEText|starttls)' "$f" \
              && { echo "::error file=$f::moteur SMTP réécrit — passer par scripts/lib/lib-alert.sh (alert_if_not_in_cooldown), seul endroit où l'envoi est défini"; st=1; }
          done
          # Et l'inverse, sinon le contrôle ci-dessus serait vert le jour où
          # PERSONNE n'envoie plus rien : le module doit toujours porter le
          # moteur qu'il centralise (cas zéro, `standards/04` §2).
          grep -qE '^[^#]*smtplib' scripts/lib/lib-alert.sh \
            || { echo "::error file=scripts/lib/lib-alert.sh::le moteur SMTP a disparu du module qui doit le porter — le contrôle ci-dessus ne mesure plus rien"; st=1; }
          # 🔴 L'adresse d'alerte ne s'écrit QU'UNE fois : le défaut de lib-alert.sh
          # (#1581). Elle l'était trois fois — `bascule.sh`, `health-watch.sh` et le
          # module qu'ils sourcent tous les deux —, et la triple écriture était
          # consciente, jamais déclarée : changer d'adresse en oubliait deux. Cas
          # zéro : 0 écriture veut dire que le défaut a disparu, ou que le motif ne
          # lit plus rien.
          n=0
          for f in $(git ls-files -- '*.sh'); do
            c=$(grep -cE '^[^#]*\bALERT_EMAIL=' "$f" || true)
            [ "$c" -gt 0 ] || continue
            n=$((n + c))
            case "$f" in
              scripts/lib/lib-alert.sh) ;;
              *) echo "::error file=$f::ALERT_EMAIL assigné hors de lib-alert.sh — l'adresse d'alerte n'a qu'un défaut, celui du module"; st=1 ;;
            esac
          done
          [ "$n" -eq 1 ] || { echo "::error::$n écriture(s) de ALERT_EMAIL= dans les scripts, exactement 1 attendue (lib-alert.sh)"; st=1; }
          exit $st

      - name: SSH entre les nœuds — clé d'hôte épinglée, commande écrite une fois
        # 🔴 #1598 : `StrictHostKeyChecking=no` était recopié dans CINQ scripts
        # d'exploitation, avec la commande entière. La clé dédiée authentifie le
        # client, jamais le serveur : un hôte qui prenait l'IP du pair recevait
        # la connexion — et la base répliquée. Refusé ici sous toutes ses
        # graphies, avec toute copie de la commande hors de lib-ssh-noeuds.sh,
        # et le cas zéro (le module doit porter `StrictHostKeyChecking=yes`).
        run: |
          bash scripts/poste/scripts-ci-ssh-noeuds.sh --selftest
          bash scripts/poste/scripts-ci-ssh-noeuds.sh

      - name: Modularité — aucun fichier au-dessus de 500 lignes
        # Rang 1 du socle. Posé le 07/08/2026 en « un fichier déjà trop long ne
        # doit pas GROSSIR » : le dépôt en comptait 26, et un plafond absolu aurait
        # échoué en permanence. La dette est à ZÉRO depuis le 02/10/2026 (#779) :
        # le plafond est désormais absolu — sans quoi la carte se remplirait de
        # nouveau sans un mot. Pourquoi, et ce qui a été retiré : en-tête du script.
        run: |
          bash scripts/poste/scripts-ci-modularite.sh --selftest
          bash scripts/poste/scripts-ci-modularite.sh

      - name: Bits d'exécution versionnés
        # Étape 0b du pré-check MEP, jusqu'ici manuelle : `core.filemode=false`
        # sur un clone Windows avale un `chmod +x`, le fichier part en 100644 et
        # Linux refuse de l'exécuter SANS message — un garde-fou inerte
        # (constaté le 26/07/2026 sur .githooks/pre-commit). Les modules
        # *sourcés* (`lib-*.sh`) restent en 644 : un bit x y serait trompeur
        # (CLAUDE.md, point 7 du pré-check).
        run: |
          st=0
          while read -r mode _ _ path; do
            # Le motif porte sur le NOM DE BASE, pas sur le chemin : les modules
            # ont été rangés dans scripts/lib/ (#337) et une exclusion ancrée à la
            # racine cessait de les reconnaître — le contrôle réclamait alors un
            # bit x sur ce qui ne doit surtout pas en porter.
            case "${path##*/}" in
              lib-*.sh) exp=100644 ;;
              *)        exp=100755 ;;
            esac
            [ "$mode" = "$exp" ] || { echo "::error file=$path::mode $mode, attendu $exp"; st=1; }
          done < <(git ls-files -s -- '*.sh' '.githooks/*')
          exit $st

  # ── Frontend: vérification build SvelteKit ───────────────────
  build-frontend:
    name: Build SvelteKit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: front
        # `npm ci`, comme `front/Dockerfile` (#1050) : `npm install` re-résolvait
        # les plages et réécrivait le lock — la CI validait donc un arbre que
        # l'image ne construisait pas. `--legacy-peer-deps` : le même drapeau que
        # l'image — la CI doit installer exactement comme elle.
        run: npm ci --legacy-peer-deps

      # Contrat HTTP du bridge WhatsApp, Baileys simulé (27/09/2026). Aucun job
      # ne touchait `whatsapp-bridge/` : une montée d'express ou de pino y était
      # verte par construction. Celle d'express 4 → 5 (#1289) passait un
      # `POST /send` sans corps JSON de 400 à 500 — le banc qui l'a vu est
      # devenu ce test. Placé ici parce que Node y est déjà installé, dans la
      # version de l'image du bridge. `--ignore-scripts` : Baileys est simulé,
      # aucun script d'installation n'a à s'exécuter sur le runner.
      - name: Contrat HTTP du bridge WhatsApp (Baileys simulé)
        working-directory: whatsapp-bridge
        run: |
          npm ci --omit=dev --ignore-scripts
          npm test

      # Vulnérabilités connues des dépendances. Le 17/08/2026, `npm audit` en local
      # en relevait QUATRE dont une haute, quand le bandeau GitHub n'en annonçait
      # qu'une basse : Dependabot suit ses propres avis sur la branche par défaut,
      # `npm audit` interroge le registre sur l'arbre réellement installé — et
      # AUCUN des deux n'était un contrôle de CI (#411). Les quatre jobs requis
      # étaient verts ; leur silence ressemblait à du calme, comme pour #409 et
      # #410, même famille de contrôles qui existent et ne tournent pas.
      # Le seuil est `low`, le plus strict : la seule des quatre qui atteignait les
      # résidents était une BASSE (`cookie`, embarquée dans le serveur SSR), quand
      # la haute était confinée à la chaîne de construction. La sévérité annoncée
      # ne dit rien de l'atteignabilité ici. Ce qui rend ce seuil tenable est
      # l'échappatoire nominative de `front/audit-exceptions.json` — motif,
      # condition de levée et date de revue par avis — sans laquelle une
      # vulnérabilité non corrigeable en amont mettrait toutes les PR au rouge et
      # ce contrôle serait désactivé dans la semaine.
      # Il sort en 2 (INCONNU, jamais OK) si le registre est injoignable : relancer.
      - name: Audit des dépendances (seuil low, exceptions nominatives)
        working-directory: front
        run: npm run lint:audit

      # Bonne formation du balisage des manuels — le document que lisent les
      # résidents. Le 17/08/2026 (#410), les deux copies portaient un `</li>` qui ne
      # fermait rien et un `<li>` jamais fermé, dans un `<div>` qui n'est pas une
      # liste. Les navigateurs réparent ce balisage en silence : la page s'affiche,
      # donc elle a l'air correcte — l'artefact est cassé et le comportement le
      # masque. Seul un analyseur strict pouvait le dire, et le seul du dépôt
      # (`npm run lint`) n'était dans aucun job.
      # Ce contrôle valide sans exiger la mise en forme : les manuels sont dans
      # `.prettierignore` (les reformater produirait un diff énorme et sans valeur,
      # et les repasserait de CRLF en LF), mais c'était prettier qui voyait le
      # défaut. Un ignore posé sans remplacer le contrôle qu'il éteint rend le
      # défaut invisible à nouveau.
      - name: Balisage des manuels bien formé
        working-directory: front
        run: npm run lint:manuels

      # Garde-fou dates : aucun formatage sans `timeZone` épinglé. Placé AVANT le
      # build (échoue en ~1 s, sans attendre la compilation). Pendant front du
      # `tests/test_dates_fr.py` côté API, qui ne scanne que `api/app/` — les deux
      # bugs de dates du 26/07/2026 étaient hors de sa portée.
      - name: Lint dates (fuseau épinglé)
        working-directory: front
        run: npm run lint:dates

      # Garde-fou pièces jointes : « est-ce une image ? », le nom affiché et la
      # liste `accept` ne se réécrivent pas dans une page. Quinze copies de ces
      # trois règles coexistaient le 03/08/2026, dont huit ignoraient .gif.
      # Comme lint:dates, il tourne AVANT le build : il échoue en une seconde.
      - name: Lint pièces jointes (règles non réécrites)
        working-directory: front
        run: npm run lint:fichiers

      # Les trois canaux « groupe WhatsApp / syndic / CS » étaient écrits à la
      # main dans SIX formulaires et avaient divergé : deux tracés SVG, trois
      # libellés, deux icônes — et un écran où le canal WhatsApp manquait tout
      # simplement (création d'un ticket, signalé le 08/08/2026). Un écran qui
      # n'affiche PAS une option ressemble à un écran normal : seul un contrôle
      # peut le voir.
      - name: Canaux de notification centralisés
        working-directory: front
        run: npm run lint:notifications

      # Le nom d'une tâche planifiée s'affiche dans la synthèse, dans la colonne
      # Tâche du journal, et dans le titre de la carte qui la détaille — ces deux
      # derniers dans des FICHIERS différents. Ils avaient divergé : la synthèse
      # disait « Sauvegarde quotidienne » quand la carte s'appelait « Système —
      # Sauvegardes », si bien qu'on ne pouvait pas relier une ligne au tableau
      # censé la détailler (signalé par l'utilisateur le 11/08/2026). Regrouper
      # ne suffit pas : rien n'empêche le prochain écran de retaper le nom.
      - name: Libellés de tâches non dupliqués
        working-directory: front
        run: npm run lint:taches

      # Trois routes sous admin/ compilaient, étaient protégées, avaient leurs
      # endpoints — et aucun écran n'y menait (#307). Dont la configuration des
      # sauvegardes : fréquence et rétention réglables par aucun chemin de
      # l'interface. Rien ne pouvait le voir — le contrôle des endpoints
      # orphelins vérifie l'autre bout de la chaîne, pas celui-ci.
      - name: Écrans admin atteignables depuis l'interface
        working-directory: front
        run: npm run lint:routes

      # L'identité des pages — identifiant, route, libellé de menu, icône,
      # descriptif — vivait dans DEUX tables qui ne se connaissaient pas, et elles
      # avaient déjà divergé de trois façons dont aucune n'était visible (#401) :
      # les deux ordres par défaut différaient ; « Mon profil » et « Notifications »
      # étaient réordonnables sans être dans le menu (geste enregistré, puis écarté
      # en silence) ; et « Délégations » était dans le menu sans être dans l'écran,
      # donc ni positionnable ni renommable.
      # Le contrôle cherche les DÉCLARATIONS (`id:`, `configId:`, `'x': {`), pas les
      # mentions : sans cette distinction il accusait un `'admin'` qui est un rôle,
      # et l'exception qu'on lui aurait ajoutée aurait rendu aveugle le fichier même
      # qui portait la table.
      - name: Table des pages non recopiée
        working-directory: front
        run: npm run lint:pages

      # La table des périmètres avait QUATRE copies autour de lib/utils.ts, dont
      # deux qui avaient déjà divergé sans que personne le voie : l'une n'avait
      # pas `aful` (un événement AFUL affichait la clé brute), l'autre écrivait
      # « Bât. 1 » avec une espace INSÉCABLE — indiscernable à l'œil, décisif
      # pour du code. C'est ainsi qu'une table recopiée dérive (#316).
      - name: Table des périmètres non recopiée
        working-directory: front
        run: npm run lint:perimetres

      # Et le STATUT d'une personne : « est locataire » était recomposé dans SIX
      # écrans, « syndic ou mandataire » dans deux, et « bailleur ou résident »
      # deux fois dans le même fichier — qui définissait par ailleurs la dérivée
      # sans l'employer. Les prédicats vivent dans `$lib/roles` (#959).
      #
      # ⚠️ Le contrôle vise le statut d'une PERSONNE, reconnu à son porteur.
      # `bail.statut === 'actif'` est un autre axe : crier dessus le ferait
      # désarmer, comme `check-stack` sur les en-têtes.
      - name: Statut d'une personne non recomposé dans un écran
        working-directory: front
        run: npm run lint:statuts

      # Et le RENDU d'un périmètre, exécuté. La règle « un espace est qualifié par
      # son parent » est écrite deux fois — front et API — parce que les contextes
      # de build l'imposent. Le 18/08 elle n'a été corrigée que d'un côté, et le fil
      # d'activité a continué d'afficher « Toit · Toit » : le test ajouté ce jour-là
      # ne pouvait vérifier le front que par présence de MOTS dans le fichier.
      # Celui-ci transpile `lib/perimetres.ts`, l'exécute sur l'arbre du ticket
      # signalé, et exige que le test Python attende la même chaîne — une seule
      # attente pour les deux implémentations.
      - name: Rendu des périmètres identique front/API
        working-directory: front
        run: npm run lint:libelle-perimetre

      # Et QUI LIT une affaire, exécuté (pastille de lecture, 25/09/2026). La
      # carte résume à l'écran une règle qui vit au serveur (`ticket_visible`) ;
      # un écart ne casse rien, il ment à chaque lecteur. Même montage : une
      # attente, `api/tests/donnees/lecture_pastille.json`, que le test Python
      # exécute contre la règle et ce contrôle contre `lib/lecture.ts`.
      - name: Pastille de lecture conforme à la règle du serveur
        working-directory: front
        run: npm run lint:lecture

      # L'en-tête de page était écrit de DOUZE façons : `.page-header` redéfini en
      # CSS local dans six pages, surchargé en ligne dans six autres, et le style du
      # <h1> recopié en ligne dans onze. Une page l'avait réécrit sans redéclarer
      # `justify-content` : elle héritait du global en silence, et son titre partait
      # à l'autre bout de l'écran (#363). La consigne existait — c'est le contrôle
      # qui manquait.
      - name: En-têtes de page passant par le composant
        working-directory: front
        run: npm run lint:entetes

      # Trois paradigmes coexistaient pour créer un objet : une boîte dans la
      # page, une modale (deux largeurs), une page dédiée. L'utilisateur l'a
      # signalé TROIS fois avant que ce soit traité (#367) — les deux premiers
      # lots avaient corrigé des symptômes périphériques sans jamais ouvrir le
      # formulaire. Ce contrôle a trouvé deux écrans que l'audit manuel avait
      # manqués.
      - name: Formulaires de création passant par le composant
        working-directory: front
        run: npm run lint:formulaires

      # 🔴 Deux axes que NI `lint:formulaires` NI « rendu DANS sa section » ne
      # regardent, signalés à l'écran le 10/09/2026 sur les contrats :
      #
      #   A. le geste d'édition écrit le MOT « Modifier » à côté du crayon, là où
      #      le reste du site rend l'icône seule — 28 usages contre 6 ;
      #   B. le même formulaire est rendu DEUX FOIS dans un écran, à 674 lignes
      #      d'écart : « la même boîte » au sens du composant, pas de l'endroit.
      #
      # Le contrôle voisin était vert sur les contrats : le formulaire ÉTAIT dans
      # sa section — la seconde, 700 lignes plus bas. Un axe non mesuré ne se
      # signale pas, il se découvre à l'écran.
      #
      # ⚠️ La règle A était DÉJÀ écrite, dans un commentaire de
      # `RubriqueHistorique` qui se disait « le dernier à écrire le mot ». Il en
      # restait cinq. C'est pour cela que ceci est un contrôle et non une
      # consigne.
      - name: Geste d'édition rendu partout de la même façon
        working-directory: front
        run: npm run lint:geste-edition

      # Les seuils de format d'une affiche de hall sont écrits DEUX fois — l'API
      # les applique, l'écran les prévoit pendant la saisie. Les contextes de
      # build interdisent de partager le fichier : le seul motif viable est la
      # copie PLUS un contrôle qui compare. Recalibrés le 10/09/2026 sur une
      # mesure du taux de remplissage, ils viennent de bouger.
      - name: Seuils de format d'affiche identiques API ⇆ écran
        working-directory: front
        run: npm run lint:seuils-affiche

      # 🔴 `lint:formulaires` vérifie QUEL cadre, jamais OÙ il est rendu — et
      # c'est la position qui a été signalée à l'écran le 08/09/2026 (#852) :
      # « l'édition est en bas de page et non dans la section sélectionnée ».
      #
      # Les sept formulaires de Résidence étaient rendus APRÈS toutes les
      # sections. Le balisage était juste, le cadre était le bon, et le contrôle
      # existant était vert : il ne regardait pas cet axe-là.
      - name: Formulaire rendu DANS sa section
        working-directory: front
        run: npm run lint:section-formulaire

      # 🔴 L'API Svelte 4 COMPILE et lève à l'exécution. `confirmation.ts`
      # montait sa boîte avec `new Confirmation(...)` depuis sa création : la
      # fonction n'a JAMAIS marché, et 17 gestes en dépendaient (suppressions,
      # archivages). Ni `svelte-check`, ni ESLint, ni le build ne pouvaient le
      # voir — tous les contrôles de ce dépôt sont statiques, et `new X()` est du
      # JavaScript valide.
      # En production, le message est minifié en « Cannot use 'in' operator to
      # search for 'Symbol($state)' in undefined » : illisible. C'est
      # l'utilisateur qui l'a signalé, sur un bouton qui « ne faisait rien ».
      - name: Aucune API Svelte 4 (elle compile, et lève au clic)
        working-directory: front
        run: npm run lint:api-svelte4

      # R4 du cadre d'interface (#430) : une entité, quatre rendus, et **toute
      # divergence entre deux états se déclare avec son motif**. Le relevé des 42
      # couples menu/entité a mesuré 13 éditions sur 23 réinventant un motif que
      # la création portait déjà, et 5 seulement portant une raison écrite — les
      # cinq en commentaires, donc invisibles à tout contrôle. L'une d'elles
      # invoquait un motif (`trace`) que le cadre n'a jamais reconnu.
      # Refuse aussi un motif `api` sans ticket : c'est un marqueur de DETTE.
      - name: Divergences entre états déclarées et motivées
        working-directory: front
        run: npm run lint:etats

      # Les quatre options d'une publication — épinglage, urgence, brouillon,
      # confidentialité — étaient écrites à TROIS endroits et avaient déjà
      # divergé : la punaise sur la carte et rien sur la case ; le CRAYON pour le
      # brouillon, alors qu'il est l'icône « Modifier » de toutes les barres
      # d'actions. Rien ne cassait — chaque écran était correct isolément.
      - name: Options de publication non recopiées
        working-directory: front
        run: npm run lint:options-publication

      # Un `input, textarea { width: 100% }` posé dans le <style> d'UNE page
      # atteignait toutes ses cases à cocher : chacune s'étirait sur la largeur du
      # formulaire et son libellé partait à l'autre bout. Un sélecteur, deux
      # écrans signalés séparément par l'utilisateur (« Nouveau sondage » et
      # « Déposer une annonce », 16/08/2026), et aucun lien apparent entre eux.
      # Quatre composants annulaient déjà ce genre de règle case par case, avec
      # un `style="width:auto"` recopié — le signe qu'on soignait le symptôme.
      - name: Aucun sélecteur d'élément de formulaire nu dans un composant
        working-directory: front
        run: npm run lint:styles

      # 🔴 SIX nomenclatures de champ coexistaient le 19/08/2026 — `.field-label`
      # (3 définitions incompatibles), `.form-group` (3), `.champ`, `.ah-champ`,
      # `.email-input`, et le `<label>` nu — et TROIS fichiers redéfinissaient
      # `.field` elle-même, le nom canonique, avec d'autres valeurs.
      #
      # Deux d'entre elles ne renvoyaient à AUCUNE définition (`OngletWhatsApp`,
      # `acces-securite`) : extraites d'`admin` sans ses styles, elles rendaient
      # leurs champs nus en production — la régression des pastilles nues, sur un
      # formulaire cette fois.
      #
      # Le relevé de #374 ne voyait qu'une des trois formes d'écriture ; les deux
      # autres ont coûté un aller-retour chacune, dont un signalé EN PRODUCTION
      # par l'utilisateur. Ce contrôle lit l'arbre des balises, où les trois se
      # ramènent à une seule question. `--selftest` le montre les refuser (#413).
      - name: Tout champ libellé vit dans un `.field`
        working-directory: front
        run: npm run lint:champs

      # 🔴 Une classe employée sans définition rend un écran NU — et rien ne le
      # signale : la page compile, les types passent, le build se tait.
      #
      # Svelte scope ses styles au FICHIER. Déplacer du balisage sans emporter ses
      # règles est la régression que ce dépôt cite depuis la v2.67.11 ; elle s’est
      # reproduite CINQ fois le 19/08/2026, dont une constatée EN PRODUCTION par
      # l’utilisateur (la télémétrie rendue en texte brut).
      #
      # `svelte-check` garde l’autre sens — « sélecteur inutilisé », une règle sans
      # balisage. Sur dix-sept règles orphelines, il en a signalé UNE. Une relation
      # a deux sens de rupture (`standards/05` §9 bis).
      # 🔴 Le pendant de `lint:classes-nues` : celui-ci refuse une redéfinition
      # SCOPÉE d'une classe de la charte. Une règle scopée ne déborde pas sur les
      # autres écrans — elle fait rendre CELUI-CI autrement, sans décision, et
      # elle gagne (Svelte ajoute sa classe de portée au sélecteur). Le relevé
      # de #607 en comptait 54 ; 35 sont parties, 19 sont déclarées.
      # 🔴 L'accessibilité est une exigence PERMANENTE du projet, écrite dans
      # CLAUDE.md, dans ux-patterns §3 et dans standards/11 — et rien ne
      # l'appliquait : le job ne bloque que sur les ERREURS, et 45 avertissements
      # a11y défilaient depuis des semaines sans que personne ne les lise (#561).
      # Liste d'exceptions nommées, jamais de seuil chiffré (#419).
      # 🔴 Le contrôle des contrôles : tout `lint:*` déclaré dans package.json
      # doit être lancé ICI. Écrit après que l'étape de `lint:a11y` ne soit PAS
      # partie dans son commit — `git add -A front` ne prend pas `.github/`. Le
      # contrôle existait, il était juste, et rien ne l'exécutait : le pire des
      # faux verts, parce qu'il ne ressemble pas à une panne (#561).
      - name: Tout contrôle déclaré est lancé par la CI
        working-directory: front
        run: npm run lint:ci

      - name: Aucun avertissement d'accessibilité non déclaré
        working-directory: front
        run: npm run lint:a11y

      # 🔴 `Icon` rend un nom inconnu en « ? » sans un mot. La checklist disait
      # « icône vérifiée dans icones-svg.json » et aucun script ne lisait le
      # catalogue côté front : `icone="database"` s'affichait en « ? » depuis
      # v2.19.0 (#1045).
      - name: Tout nom d'icône existe dans le catalogue
        working-directory: front
        run: npm run lint:icones

      - name: Aucune redéfinition scopée de la charte
        working-directory: front
        run: npm run lint:charte

      #  L'angle mort du précédent : il compare aux classes de la CHARTE, donc il
      #  ne voit pas une règle dupliquée sous un nom qui n'y est pas. C'est ce
      #  qu'était `.auth-wrapper`, resté deux consolidations durant.
      - name: Aucune règle CSS écrite deux fois
        working-directory: front
        run: npm run lint:css-duplique

      - name: Aucune classe employée sans définition
        working-directory: front
        run: npm run lint:classes-nues

      # La même famille de défaut, par l'autre bout : la classe EST définie, mais
      # c'est un modificateur — elle ne peint qu'un fond et une couleur, et sans
      # sa base l'élément sort en rendu natif du navigateur. Un bouton
      # « Enregistrer » gris carré au milieu de la charte, signalé à l'écran le
      # 20/08/2026 ; le relevé en a trouvé TROIS autres, dans un écran d'admin
      # que personne ne regardait.
      #
      # Le contrôle ne tient aucune liste : il DÉDUIT de `app.css` quelles classes
      # `btn-*` se suffisent à elles-mêmes. Une liste divergerait au premier
      # modificateur ajouté — et c'est le nouveau que personne n'a en tête.
      - name: Aucun modificateur employé sans sa classe de base
        working-directory: front
        run: npm run lint:modificateurs

      # L'AUTRE SENS de la relation : un sélecteur DÉFINI est-il EMPLOYÉ ?
      # `lint:classes-nues` demande l'inverse. Une relation a deux sens de
      # rupture, et un contrôle qui n'en garde qu'un laisse passer l'autre.
      #
      # 🔴 `svelte-check` le disait déjà — pour 33 sélecteurs dans 9 fichiers, à
      # chaque exécution, depuis des semaines. Noyés parmi 95 avertissements que
      # le job ne regarde pas (`--threshold error`), et à raison : les rendre
      # bloquants d'un coup rendrait le job rouge en permanence, donc désarmé.
      #
      # Le relevé a donc été ramené à ZÉRO d'abord, et ce contrôle rend cette
      # famille-là bloquante. Les autres restent des avertissements tant qu'on ne
      # les a pas soldées — c'est la seule façon d'en faire des contrôles plutôt
      # que du bruit (#557, et #561 pour les 45 défauts d'accessibilité).
      - name: Aucun sélecteur CSS orphelin
        working-directory: front
        run: npm run lint:css-orphelin

      # 🔴 Un `<label>` qui nomme un GROUPE n'associe rien — et il le fait en
      # silence : le lecteur d'écran n'annonce pas le champ. Quinze écrans dans
      # ce cas (#561), tous réparés avant que ce contrôle ne devienne bloquant.
      # Deuxième famille d'avertissements `svelte-check` ramenée à zéro puis
      # rendue bloquante, après les sélecteurs orphelins (#557) — c'est la seule
      # façon d'en faire des contrôles plutôt que du bruit.
      - name: Aucun libellé sans contrôle associé
        working-directory: front
        run: npm run lint:libelles

      # Un événement Svelte non écouté n'est pas une erreur : c'est un silence.
      # `evol_annuler` était dispatché, transféré, et traité par personne — le
      # bouton Annuler ne faisait rien, neuf jours durant (#505). Le relevé qui a
      # fondé ce contrôle a trouvé TROIS autres gestes morts que rien ne cherchait.
      - name: Aucun événement dispatché sans personne pour le traiter
        working-directory: front
        run: npm run lint:evenements

      # 🔴 `.catch(() => [])` : trois caractères qui transforment une PANNE en
      # ABSENCE. L'écran affiche « Aucun sondage » exactement comme s'il n'y en
      # avait pas — et le 19/08/2026 l'utilisateur a cru ses données détruites et
      # en a demandé la restauration. Elles étaient intactes.
      #
      # Le contrôle est ÉTROIT à dessein : il ne vise que les deux formes qui se
      # rendent comme une absence — le repli sur une COLLECTION vide, et le
      # `catch` muet dont le `try` affecte une variable après un `await` (#1459).
      # Les `catch` silencieux qui n'affectent rien (marquage de lecture,
      # télémétrie, révocation de jeton) ne sont pas concernés — les refuser
      # aurait fait désarmer le contrôle dans la semaine.
      - name: Aucun échec d'appel rendu comme une absence
        working-directory: front
        run: npm run lint:catch-vide

      # Deux incidents le 16/09/2026, à quelques heures d'intervalle, même cause.
      #
      # `pages_order` est une DONNÉE (base, éditable en administration), et un
      # identifiant qui s'y répétait faisait rendre la même page deux fois. Le
      # `{#each … (pg.id)}` levait alors `each_key_duplicate` — erreur FATALE de
      # Svelte : l'onglet basculait, le contenu restait, et plus aucune mise à
      # jour ne passait sur AUCUNE page. Deux fois en production, et pris pour un
      # « figeage du site » alors que le serveur répondait en moins de 200 ms.
      #
      # Puis la colonne « Rôles actifs » a figé l'écran Utilisateurs pour la même
      # raison : `bailleur` est l'alias hérité de `copropriétaire_bailleur`, donc
      # DEUX rôles pour UN libellé, et la clé était le libellé.
      #
      # Le contrôle EXÉCUTE les fonctions qui alimentent ces listes : relire leur
      # code aurait laissé passer toute réécriture qui perd le dédoublonnage.
      - name: Aucune liste à clé ne peut rendre deux fois la même clé
        working-directory: front
        run: npm run lint:cles-listes

      # Six écrans, TROIS mots pour la même notion — et « Historique » désignait
      # AUSSI le fil d'un objet (cadre #430), les deux coexistant sur l'écran
      # Tickets. Le mot a été unifié le 19/08 À LA MAIN, écrit en dur dans cinq
      # fichiers : ils concordaient parce qu'on venait de les aligner, à un
      # instant où tout coïncide. Rien ne le tenait (#516, point 4).
      - name: Aucun titre de section d'archives écrit en dur
        working-directory: front
        run: npm run lint:archives

      # 🔴 Un formulaire collecte un champ, l'écran l'affiche, et le relais le
      # JETTE en recopiant la charge utile champ par champ. Rien ne lève : le
      # formulaire annonce l'enregistrement, le serveur enregistre un objet
      # valide, et seul l'écran — plus tard — trahit la perte. Constaté sur le
      # périmètre d'une évolution de ticket, signalé à l'écran (#529).
      - name: Aucun champ perdu entre un formulaire et son relais
        working-directory: front
        run: npm run lint:charge-utile

      # 🔴 Les garde-fous du front exposent un `--selftest` … que rien ne lançait.
      # Un contrôle dont la logique n'est éprouvée nulle part peut devenir muet
      # sans que personne ne le sache : il rend « aucune faute trouvée » aussi
      # bien quand il n'y en a pas que quand il ne sait plus en trouver. C'est la
      # leçon de `check-reliability` (11/08/2026), appliquée ici — les self-tests
      # des scripts d'infra, eux, tournent depuis le 30/07.
      - name: Auto-tests des garde-fous du front
        working-directory: front
        run: |
          node scripts/check-evenements.mjs --selftest
          node scripts/check-csp-servie.mjs --selftest
          node scripts/check-lien-evitement.mjs --selftest
          node scripts/check-a11y.mjs --selftest
          node scripts/check-icones.mjs --selftest
          node scripts/check-seuil-listes-courtes.mjs --selftest
          node scripts/check-catch-vide.mjs --selftest
          node scripts/check-archives.mjs --selftest
          node scripts/check-charge-utile.mjs --selftest
          node scripts/check-modificateurs.mjs --selftest
          node scripts/lib-commentaires.mjs --selftest
          # 🔒 Une modale qui contient une saisie ne se ferme pas au clic sur le
          # fond. La protection reposait sur deux déclarations que l'écran devait
          # penser à poser — trois modales d'administration portant 8, 3 et 2
          # champs ne les avaient posées ni l'une ni l'autre (#640). Elle vit
          # maintenant dans le composant ; ce test éprouve sa décision, et échoue
          # si la détection qui l'alimente disparaît.
          node scripts/check-fermeture-modale.mjs --selftest
          # 🔴 Porte les fonctions pures de `lint:styles` ET de `lint:classes-nues`,
          # expose un `--selftest` depuis sa création… que RIEN ne lançait (#562).
          # Le module le plus partagé du lot était le seul non éprouvé.
          node scripts/lib-analyse-styles.mjs --selftest
          node scripts/check-largeur-saisie.mjs --selftest
          node scripts/check-version-servie.mjs --selftest
          # La passe `EvolForm` de `lint:etats` (#463) — et son relevé, qui ne
          # peut que décroître. Ajouté ICI le jour même où le module naît :
          # c'est l'oubli d'hier qui a laissé `lib-analyse-styles` non éprouvé.
          node scripts/lib-etats-evolution.mjs --selftest
          # Le tuyau partagé par `lint:css-orphelin` et `lint:libelles` : lancer
          # svelte-check, retirer les couleurs, apparier chaque message à son
          # emplacement. Deux de ces gestes ont déjà coûté un défaut ici.
          node scripts/lib-svelte-check.mjs --selftest
          # La lecture d'une source SANS supposer sa mise en forme — partagée par
          # `lint:pages`, `lint:taches`, `lint:modales` et `lint:soumission`. Les
          # quatre lisaient le code avec des motifs ancrés sur une disposition et
          # tombaient au premier passage de Prettier (#419). Chaque cas y est
          # écrit DEUX fois, resserré et reformaté : un test d'une seule forme ne
          # dirait rien, et c'est l'angle mort d'où ils venaient.
          node scripts/lib-lecture-source.mjs --selftest
          # Le squelette des contrôles « une notion, une source » (#779) : cas
          # zéro, témoin, exceptions qui doivent servir, commentaires blanchis.
          # Six contrôles le recopiaient, et `lint:type-lot` sans cas zéro.
          node scripts/lib-source-unique.mjs --selftest
          # Le relevé des classes des FEUILLES GLOBALES que plus rien n'emploie
          # (#1537) : `lint:css-orphelin` disait « aucun sélecteur orphelin » en
          # ne lisant que les `<style>` des composants — 23 classes de
          # `src/styles/` étaient mortes. Commentaires, `<style>` locaux,
          # sélecteurs d'attribut et témoin y sont éprouvés.
          node scripts/lib-classes-globales.mjs --selftest
          # Le pré-remplissage du kanban par les prestataires (#605) : deux
          # boucles quasi identiques dans une page de 848 lignes, qu'aucun
          # contrôle ne touchait. Les fonctions pures vivent désormais dans
          # `$lib/init-prestataires.ts` — que Node lit directement, donc le
          # module éprouvé est CELUI QUE LE SITE EMBARQUE, pas une copie.
          npm run lint:init-prestataires
          # Les écrans que personne n'a ouverts (#1630) : la comparaison de la table
          # des pages aux pages vues, éprouvée sur le module que le site embarque.
          npm run lint:ecrans-non-visites
          # La mécanique des cartes dépliables (#640) : elle vivait DEUX fois
          # dans `espace-cs` — membres du CS et du syndic —, avec deux fonctions
          # de retrait littéralement identiques, et rien ne l'éprouvait. Le
          # décalage d'index après un retrait est la partie qu'on recopie sans la
          # relire : une erreur d'un cran ouvre la carte du voisin, et cela ne se
          # voit qu'en supprimant un membre du MILIEU de la liste.
          npm run lint:liste-depliable
          # Un seul bloc déplié à la fois, partout (30/09/2026) : l'autotest de
          # `$lib/accordeon` (groupes, correction qui reste ouverte, main rendue à
          # la destruction) et le refus d'un nouvel état d'ouverture en `Set`.
          npm run lint:accordeon
          # Retrouver l'inscrit et le logement d'un membre de l'annuaire par son
          # NOM (#779) : ces règles vivaient dans une page, sans aucun test. Un
          # parking ou une cave ne localise pas ; le lot résolu l'emporte.
          npm run lint:annuaire-rapprochement
          # « Ce prompt est-il celui d'origine ? » (#994) : l'écran comparait au
          # VIDE, donc un texte collé identique s'annonçait « modifié » et une
          # origine plus récente ne se signalait jamais. Ce qui est fragile n'est
          # pas la comparaison mais sa NORMALISATION — un copier-coller Windows ne
          # diffère que par ses fins de ligne, et une normalisation trop large tairait
          # une vraie différence.
          npm run lint:prompt-origine

      # 🔴 Une balise ouvrante fermée AU MILIEU de ses attributs : les attributs
      # restants sortent du balisage et s'affichent EN TEXTE à l'écran.
      #
      # `svelte-check` ne voit rien — un `class:x={…}` après le `>` est du texte,
      # et du texte est valide. Build vert, types verts, tests verts, et la page
      # montre du code. Constaté EN PRODUCTION le 18/08/2026, deux fois dans la
      # même journée (CarteEvenement puis CarteTicket), à chaque fois après une
      # réécriture automatisée de la balise.
      - name: Aucune balise ouvrante fermée avant ses attributs
        working-directory: front
        run: npm run lint:balises

      # 🔴 LA règle la plus critique du front — `{@html}` sans assainissement —
      # n'était vérifiée par AUCUN contrôle : ni un `lint:*`, ni un test d'`api/`.
      # Elle reposait entièrement sur la vigilance de qui écrit la ligne, et
      # `svelte/no-at-html-tags` avait été désactivée en v2.70.0 faute de savoir
      # distinguer les 50 usages voulus d'un usage dangereux (#429).
      #
      # Le contrôle lit la liste des assainisseurs DANS `src/lib/sanitize.ts` —
      # une liste recopiée aurait divergé au premier ajout, ce qui est exactement
      # ce qui s'était produit : `CLAUDE.md` ne nommait que `safeHtml` quand trois
      # fonctions étaient en service. Il exige aussi que le nom vienne de
      # l'IMPORT : une fonction locale homonyme qui ne ferait rien passerait
      # sinon. C'est ainsi qu'a été trouvée `renderContent` (tickets/[id]), copie
      # littérale de `safeDescription` — correcte par chance.
      - name: Aucun {@html} sans assainissement
        working-directory: front
        run: npm run lint:html

      # Le nom d'une section de formulaire écrit DEUX FOIS à l'écran : la section
      # le pose en petites capitales, et le champ qu'elle contient le repose en
      # dessous — `FichiersUpload`, `PerimetrePicker` et `DestinatairePicker`
      # portent tous un intitulé par défaut. `SectionFormulaire` en a tiré une
      # règle écrite dans son propre en-tête le 16/08/2026, après le doublon
      # « PÉRIMÈTRE / Périmètre * ». Le 18/08, le doublon « PHOTOS / Photos » est
      # apparu sur l'annonce de hall — deux jours plus tard, sur une règle écrite,
      # connue et déjà appliquée deux fois ailleurs.
      #
      # Les deux fois, c'est l'UTILISATEUR qui l'a vu, à l'écran, en production.
      # Une règle sans garde-fou tient tant que celui qui écrit s'en souvient.
      - name: Aucun intitulé de section écrit deux fois
        working-directory: front
        run: npm run lint:titres

      # `Modale.svelte` a été créé le 28/08/2026 pour porter le fond, le rôle,
      # `Échap` et le verrou de défilement UNE fois. Le lot qui l'a créé a
      # converti UN écran sur dix : les dix-neuf autres modales sont restées
      # écrites à la main, et SEIZE d'entre elles ne se fermaient toujours qu'à
      # la souris — le défaut même que le composant venait corriger (#561).
      #
      # La CI était verte : rien ne rapproche un composant neuf des copies qu'il
      # remplace. C'est le motif « le paquet est ajouté, le monolithe reste ».
      # Le contrôle refuse aussi les copies LOCALES de `.modal-overlay`,
      # `.modal` et `.modal-box` : les quatre qui existaient avaient toutes
      # divergé de la feuille commune, sans que personne l'ait décidé.
      - name: Fond de modale passant par le composant
        working-directory: front
        run: npm run lint:modales

      # Le défilement du document et la touche Échap, empruntés par Modale ET la
      # visionneuse : écrits deux fois, une photo ouverte depuis une modale
      # rendait le défilement, et Échap fermait les deux couches (#1042).
      - name: Couches superposées passant par $lib/couche
        working-directory: front
        run: npm run lint:couches

      # Une section Description passe par SectionDescription (assistant IA
      # compris) : l'annonce de hall la montait à la main (#1089) ; les deux
      # écarts légitimes sont déclarés avec leur raison (#1240).
      - name: Description passant par SectionDescription
        working-directory: front
        run: npm run lint:description-unique

      # Une section Workflow DÉCORATIVE : les pastilles s'affichaient en création
      # d'un ticket, se cliquaient, et `statut` ne partait pas dans le POST — le
      # ticket repartait toujours en « Ouvert » (#435). Le serveur l'acceptait
      # pourtant depuis le 16/08 : c'est le front qui ne demandait rien. La même
      # section fonctionnait sur les publications, si bien que deux entités
      # divergeaient sur un champ que le cadre #430 déclare identique.
      #
      # Un champ qu'on voit et qui ne fait rien est la faute symétrique du 200 qui
      # n'écrit rien : il fabrique la confiance qu'il devrait retirer.
      - name: Aucune section Workflow décorative
        working-directory: front
        run: npm run lint:workflow

      # 🔴 La CONSIGNE qui fabrique la duplication. La règle XSS s'appuie sur une
      # liste de fonctions d'assainissement, écrite six fois — dont cinq copies ne
      # nommaient qu'une fonction sur trois le 19/08/2026 (#482).
      #
      # Ce n'est pas resté théorique : `svelte-patterns` déclarait « légitimement
      # local » un helper qui ÉTAIT `safeDescription`, laquelle avait été créée
      # pour le supprimer. Une troisième copie est apparue dans le code sous le nom
      # `renderContent`, écrite par quelqu'un qui suivait correctement la doc.
      #
      # Aucun contrôle ne pouvait le voir : `lint:html` regarde le code, et le code
      # produit était CORRECT — c'est sa raison d'être qui était périmée. La CI ne
      # lisait ni CLAUDE.md ni .claude/skills/. Celui-ci les lit, et compare à ce
      # que `sanitize.ts` exporte réellement.
      #
      # Il refuse aussi un COMPTE recopié (#1541) : CLAUDE.md et `ux-patterns`
      # disaient « treize » sections six jours après l'entrée de la quatorzième,
      # tout en renvoyant à `SECTIONS_ORDRE`. Juste ou faux, un nombre se périme.
      - name: Consignes complètes (listes et comptes lus à leur source)
        working-directory: front
        run: npm run lint:consignes

      # Le renouvellement silencieux de session était désactivé par le PRÉFIXE
      # `/auth/`, posé pour empêcher `/auth/refresh` de se rappeler lui-même. Il
      # attrapait aussi `/auth/me` : pendant les sept jours où la session restait
      # renouvelable, les requêtes de la page se renouvelaient et s'affichaient
      # pendant que `me()` était refusé sans essai — contenu à l'écran, menu vidé
      # de ses quatorze entrées, et un second rafraîchissement nécessaire pour
      # voir la mire (#379, signalé le 16/08/2026). Une exception en préfixe est
      # juste pour sa cible et fausse pour ses voisines, sans que rien ne le dise.
      - name: Renouvellement de session par liste nominative
        working-directory: front
        run: npm run lint:session

      # Sept formulaires de création, six libellés de soumission : « Publier »,
      # « Envoyer la demande », « Créer le sondage », « Publier l'annonce »,
      # « Soumettre », « Enregistrer » — plus « Soumettre la demande » sur accès
      # & badges, que le relevé du ticket n'avait pas vu. Aucun n'était faux ;
      # l'ensemble n'avait pas de logique (#396). Trancher n'aligne que
      # l'existant : c'est le formulaire SUIVANT qui réinvente son libellé, comme
      # pour les en-têtes (#363) et les formulaires eux-mêmes (#367).
      - name: Libellé de soumission unique sur les formulaires de création
        working-directory: front
        run: npm run lint:soumission

      # Vérificateur de types. Il existait dans package.json depuis toujours et
      # n'était lancé par RIEN — un garde-fou présent mais non armé, comme un
      # hook versionné en 100644. Or **Vite transpile le TypeScript sans le
      # vérifier** : le job ci-dessous était donc vert quoi qu'il arrive côté
      # typage. C'est ce qui a rendu la PR #267 (typescript 5 → 6, une MAJEURE)
      # verte sans qu'aucun contrôle de types n'ait tourné — même motif que
      # WeasyPrint dans .github/dependabot.yml : « la PR était VERTE parce
      # qu'aucun test ne rend un PDF ».
      # Armé le 04/08/2026 après avoir ramené la dette de 12 erreurs à 0, et
      # après avoir vérifié qu'il sort bien en 1 sur une erreur introduite
      # exprès — un contrôle qu'on n'a pas vu rougir n'est pas un contrôle.
      # Les 171 avertissements restants ne le font pas échouer : seule une
      # ERREUR bloque. Les résorber est un lot à part.
      # 🔴 PREMIÈRE EXÉCUTION D'ESLINT EN CI (#419, point 4 — 20/08/2026).
      #
      # La configuration existait depuis le 17/08 (#424) mais n'était câblée nulle
      # part : le relevé n'était pas vert, et le ticket demandait à raison de ne
      # câbler qu'ensuite. Un linter configuré et jamais exécuté ressemble à un
      # linter — c'est le même défaut, une couche plus haut.
      #
      # ⚠️ Le job est vert SANS `--max-warnings <chiffre>`. Chaque règle coupée
      # l'est NOMMÉMENT dans `eslint.config.js`, avec son compte et son motif ; la
      # dette est suivie en #549 (six règles) et #550 (74 morts réels). Un seuil
      # chiffré aurait masqué tout, y compris ce qu'on ajoutera demain.
      #
      # Ce que la première exécution a rapporté, et que rien d'autre ne pouvait
      # voir : un caractère de recul U+0008 au milieu d'une expression régulière
      # de `check-workflow-envoye.mjs`, invisible dans tout éditeur, qui rendait
      # inerte l'étape « retirer la balise avant de chercher ailleurs ».
      # Avant ESLint : son PÉRIMÈTRE doit être juste, sinon son verdict dépend de
      # ce qui traîne sur la machine (#1064 — ~2075 erreurs sur les bundles que
      # Playwright écrit le temps de son exécution, une fois sur deux).
      - name: Périmètre d'ESLint (rien de produit n'est analysé)
        working-directory: front
        run: npm run lint:eslint-ignore

      - name: ESLint (jeu de règles déclaré, sans seuil chiffré)
        working-directory: front
        run: npm run lint:eslint

      # Le front n'est jamais le gardien d'un droit, mais il doit dire la MÊME
      # chose que le serveur : plus large, il tend un bouton qui finira en 403 ;
      # plus étroit, il rend une capacité introuvable (#1041).
      - name: Aucun droit recomposé dans un écran
        working-directory: front
        run: npm run lint:droits

      - name: Onglet réservé masqué sur le prédicat de sa route d'API
        working-directory: front
        run: npm run lint:onglets-reserves

      # « Agir pour… » posait `X-Acting-As` sur chaque requête, et seule une
      # dépendance qu'AUCUNE route ne prenait le lisait : l'aidant écrivait sous
      # sa propre identité pendant que l'écran disait le contraire (#1534).
      # Un en-tête posé par le front doit être lu par une route.
      - name: En-tête posé par le front lu par une route de l'API
        working-directory: front
        run: npm run lint:en-tetes-lus

      # Un garde refuse sur un « non » avéré, jamais sur un « pas encore » : les
      # stores de rôle valent faux tant que `authApi.me()` n'a pas répondu (#1083).
      - name: Aucune garde ne décide avant que l'authentification soit résolue
        working-directory: front
        run: npm run lint:gardes-auth

      # Un nombre qui coupe une liste ET sert de seuil est un plafond : écrit deux
      # fois, il donne un compteur qui ment le jour où l'un des deux bouge (#1076).
      - name: Aucun plafond de liste écrit en clair dans un écran
        working-directory: front
        run: npm run lint:plafond-liste

      - name: Aucune largeur de saisie écrite dans un écran
        # 🔴 Signalé à l'écran le 30/08/2026 : « sur admin / paramétrage le texte
        # ne prend pas la bonne largeur ». La carte occupait toute la page, ses
        # champs s'arrêtaient à 600 px, et les aides se repliaient sur quatre
        # lignes en laissant la moitié droite vide.
        #
        # `--largeur-saisie` a été généralisée à 100 % le 18/08/2026 — mais SIX
        # écrans portaient encore leur propre `max-width` en ligne (600, 600, 580,
        # 460, 700, 580), donc six valeurs que la généralisation ne pouvait pas
        # atteindre : aucun n'employait la classe. C'est le défaut de la prop
        # `marge` d'`EntetePage` (#372), reproduit sur le conteneur.
        #
        # ⚠️ `ux-patterns` §9 le disait déjà — « ne jamais écrire une largeur dans
        # une page » — et le défaut a quand même été trouvé par l'utilisateur, en
        # production. Une règle sans garde-fou tient tant qu'on s'en souvient.
        working-directory: front
        run: npm run lint:largeur-saisie

      - name: Clés de liste (plafond décroissant)
        # 🔴 `svelte/require-each-key` compte 105 signalements : une règle ESLint
        # qui échoue en permanence finit désarmée, et #419 interdit à raison le
        # `--max-warnings <chiffre>` qui la masquerait avec toutes les autres.
        # Ce plafond-ci ne concerne qu'un défaut NOMMÉ, nomme chaque occurrence
        # quand il dépasse, et baisse à chaque lot — le motif de
        # `lint:confirmation`, déjà en service.
        #
        # Sans clé, Svelte réutilise les nœuds par POSITION. Le relevé du
        # 30/08/2026 a montré que le danger est aujourd'hui CONTENU — ce dépôt
        # indexe son état par identité (`expandedEvId === ev.id`) — mais rien ne
        # préviendrait le jour où un composant de liste tiendrait un état interne.
        working-directory: front
        run: npm run lint:each-key

      - name: Tableaux dans un conteneur défilant (responsive)
        # 🔴 Un `<table>` ne se comprime pas, et `normes.css` pose même
        # `white-space: nowrap` sur ses cellules sous 767 px — à raison, une date
        # coupée en deux est illisible. Sa largeur est donc incompressible.
        #
        # Or `socle.css` porte `body { overflow-x: hidden }`. Les deux ensemble
        # donnent le pire résultat : le tableau dépasse l'écran ET le dépassement
        # est masqué. Les dernières colonnes deviennent INATTEIGNABLES — pas de
        # barre, pas de geste. Un débordement visible se contourne, celui-là non.
        #
        # Cinq tableaux y échappaient au 04/09/2026. Personne ne l'avait vu :
        # sur un grand écran, tout va bien.
        working-directory: front
        run: npm run lint:tableaux

      - name: L'éditeur riche suit l'API de la version de Tiptap installée
        # 🔴 La montée 2 → 3 (#724, correctif de GHSA-cp6q-959q-f8rh) a cassé deux
        # choses qui ne se voient PAS à l'exécution : `setContent(html, false)`
        # dont le second argument est devenu un objet, et `Underline` désormais
        # INCLUS dans StarterKit — l'importer en plus le charge deux fois, Tiptap
        # avertit dans la console, et une console n'est lue par personne.
        #
        # Le contrôle LIT les extensions du paquet installé ; il ne croit pas un
        # guide de migration. La prochaine montée en déplacera d'autres, et il le
        # dira. Il ne remplace pas la vérification à l'écran, qui reste due.
        working-directory: front
        run: npm run lint:editeur

      - name: Un seul éditeur riche
        # 🔴 `LegalEditor` recopiait l'amorçage de `RichEditor` (#1539) : 53
        # lignes sur 104, et `lint:editeur` les COMPTAIT sans refuser le second.
        # Un `new Editor(` ou un import `@tiptap/…` hors de `RichEditor` est
        # refusé ; ce qui manque à un écran s'y ajoute en prop.
        working-directory: front
        run: npm run lint:editeur-unique

      - name: Fiches de l'annuaire montées par une seule liste
        # 🔴 `AnnuaireConseil` et `AnnuaireSyndic` montaient chacun `CarteMembre`
        # dans leur boucle, sept événements câblés à l'identique (#1539) : la
        # fiche était factorisée, son câblage non. `<CarteMembre` hors
        # d'`AnnuaireMembres` est refusé.
        working-directory: front
        run: npm run lint:annuaire-membres

      - name: Classe relayée à un composant, stylée en :global() borné
        #  🔴 Une classe passée en prop `classe=` est appliquée par le COMPOSANT,
        #  sur son balisage : elle y prend SON scope, pas celui de qui la passe.
        #  Écrite à plat chez l'appelant, la règle ne correspond à rien — et les
        #  DEUX appelants du site étaient dans ce cas au 01/09/2026, avec une mise
        #  en page morte depuis toujours (liste de lots sans bordure, deux champs
        #  empilés au lieu d'être côte à côte).
        #  ⚠️ `svelte-check` ne le voit pas : il ne signale « sélecteur inutilisé »
        #  que si le fichier n'a aucun autre usage de la classe.
        working-directory: front
        run: npm run lint:classe-relayee

      - name: Cadre du geste (édition en fenêtre, création en boîte)
        # 🔴 L'AUTRE MOITIÉ de `ux-patterns` §14 bis, qui n'avait aucun contrôle.
        # `lint:formulaires` refuse une création EN modale ; rien ne refusait une
        # édition HORS modale. C'est ce qui a laissé « Petites annonces » éditer
        # dans la carte pendant six conversions de #640 — et le « Reste » du
        # ticket ne le listait même pas.
        working-directory: front
        run: npm run lint:cadre-geste

      - name: Le manuel annonce les menus du site, et le bon public
        # 🔴 #651 tient en une phrase : « le manuel RECOPIE des tables que le code
        # fait évoluer, et rien ne les rapproche ». La section « Les écrans » porte
        # deux tables que le code tient déjà — les routes (`pages.ts`) et qui les
        # voit (`Nav.svelte`). En écrire une troisième en prose aurait refait le
        # défaut le jour même où on le corrige.
        #
        # ⚠️ Le contrôle lit des attributs `data-page`/`data-acces`, pas la prose :
        # « la prose ne se lit pas comme une table » (#651), et un contrôle qui crie
        # sur du légitime finit désarmé.
        working-directory: front
        run: npm run lint:manuel-menus

      - name: Le manuel dit ce que chaque profil voit
        # `lint:manuel-menus` vérifie qui voit une ENTRÉE ; il laissait passer
        # « Tout le monde » sur Résidence, dont le carnet est fermé aux
        # locataires (signalé à l'écran le 24/09/2026). Celui-ci confronte au
        # code les onglets réservés, la table des sections vue du
        # résident et les catégories qu'il peut choisir — que le README, lui,
        # ne doit ni énumérer ni compter (#1540 : « Huit catégories », dont une
        # réservée au conseil depuis #1098).
        working-directory: front
        run: npm run lint:manuel-profils

      - name: Confirmation dans la charte (plafond décroissant)
        # Le nombre de `confirm()` NATIFS ne peut que baisser. La boîte du
        # navigateur bloque le fil d'exécution, ignore la charte, et donne le
        # MÊME aspect à « archiver » et à « supprimer définitivement » — alors
        # que l'un se défait et l'autre non.
        #
        # Un plafond et non une interdiction : convertir les vingt-cinq écrans
        # d'un coup toucherait tout avant qu'on en ait regardé un, ce que R5 du
        # cadre #430 interdit. Le plafond empêche d'en AJOUTER et baisse à chaque
        # écran repris — il échoue aussi s'il reste au-dessus du réel.
        working-directory: front
        run: npm run lint:confirmation

      - name: Aperçu de diffusion branché des DEUX côtés
        # 🔴 Brancher l'aperçu demande DEUX gestes : fournir la fonction
        # (`demanderApercu`) et s'intercaler dans la soumission
        # (`ouvrirSiDiffusion`). Le lot du 31/08/2026 a fait le premier sur deux
        # écrans et oublié le second : tout avait l'air branché — endpoint
        # correct, modale prête — et l'envoi partait sans rien montrer.
        #
        # ⚠️ Rien ne pouvait le signaler : `svelte-check` est vert (les deux
        # moitiés compilent séparément), les tests du serveur aussi (l'endpoint
        # est correct). Le seul symptôme a été un mail reçu par ses
        # destinataires — c'est-à-dire le dommage lui-même.
        working-directory: front
        run: npm run lint:apercu

      - name: Périmètre hérité par une entrée d'historique
        # Fonction PURE dont tout le sens tient dans trois cas qui se
        # ressemblent, et dont un est contre-intuitif : une entrée qui ne dit
        # RIEN du périmètre ne change rien. Il est tentant de prendre « la
        # dernière entrée » sans regarder si elle disait quelque chose — et l'on
        # ferait alors revenir le périmètre du ticket à chaque commentaire vide.
        #
        # Ce dépôt n'a pas de lanceur de tests côté front : la fonction est
        # transpilée et EXÉCUTÉE, comme `lint:libelle-perimetre` le fait déjà.
        working-directory: front
        run: npm run lint:perimetre-herite

      - name: Le filtre d'états couvre ce que la liste affiche
        # Il proposait les seuls états ACTIFS, au motif que « les clos ont leur
        # section Historique ». Faux d'une semaine : un ticket clôturé reste sept
        # jours dans la liste principale, et « Résolu » s'y affichait sans qu'aucun
        # bouton puisse l'isoler (signalé à l'écran le 01/09/2026).
        #
        # Le défaut n'était pas la liste mais sa SOURCE : elle décrivait ce qu'on
        # croyait afficher. La fonction est transpilée et EXÉCUTÉE ici.
        working-directory: front
        run: npm run lint:filtre-statuts

      - name: Le carnet filtré par année suit le décret n° 2001-477
        # Les travaux se datent par leur année de réalisation (art. 4), les
        # contrats EN VIGUEUR restent (art. 3 et 4), rien ne se purge. La règle
        # (`$lib/carnet`) est transpilée et exécutée ici.
        working-directory: front
        run: npm run lint:carnet-annee

      - name: Un refus du serveur se lit en phrase, jamais en JSON
        # #1327 : le toast de « Nouveau prestataire » affichait la liste de
        # validation brute d'un 422. `$lib/detail-erreur` est exécuté ici.
        working-directory: front
        run: npm run lint:detail-erreur

      - name: « Prénom NOM » concorde entre le front et l'API
        # La règle « le nom passe en capitales, le prénom garde sa casse » est
        # écrite DEUX fois — les contextes de construction sont ./api et ./front,
        # rien de la racine n'entre dans les images. Le motif viable est copie +
        # concordance EXÉCUTÉE : le contrôle transpile lib/noms.ts, l'exécute sur
        # les cas LUS dans test_noms_affichage.py, et refuse la moindre dérive.
        #
        # `perimetreLabel` a été corrigée d'un seul côté le 18/08 et a mis neuf
        # jours à se voir — c'est l'utilisateur qui l'a vue, pas la CI.
        working-directory: front
        run: npm run lint:noms

      - name: Case « M'envoyer une copie » liée ET envoyée
        # Même forme de piège que `lint:apercu`, rencontrée deux fois le même
        # jour : un écran lie la case et ne met jamais `envoyer_auteur` dans sa
        # charge utile. La case s'affiche, se coche, et ne fait rien — et le seul
        # symptôme est une copie qui n'arrive pas, c'est-à-dire une absence.
        working-directory: front
        run: npm run lint:diffusion-auteur

      - name: Formatage (prettier --check)
        # 🔴 Le dernier point de #419, et sans lui les trois autres ne servent
        # à rien : le dépôt vient d'être reformaté, et un format que rien ne
        # vérifie rediverge au premier fichier écrit à la main.
        #
        # ⚠️ Il est placé APRÈS ESLint et non avant : quand les deux échouent,
        # c'est la faute de logique qu'on veut lire en premier, pas la virgule
        # mal placée. Un formatage rouge en tête de journal fait scroller.
        #
        # ⚠️ `endOfLine: "auto"` dans `.prettierrc` — ce dépôt est légitimement
        # MIXTE CRLF/LF, et un `lf` forcé aurait converti 200 fichiers en un
        # commit illisible, exactement ce que `.githooks/pre-commit` refuse.
        working-directory: front
        run: npm run lint:format

      - name: Vérification des types (svelte-check)
        working-directory: front
        run: npm run check

      - name: Build
        working-directory: front
        run: npm run build
        env:
          VITE_GIT_HASH: ${{ github.sha }}
          # Pas de VITE_BUILD_DATE ici : le `define` de vite.config.ts remplace ce
          # symbole à la compilation et gagne toujours sur la variable
          # d'environnement (vérifié). La valeur passée était de surcroît un
          # `github.run_id`, pas une date.

      # Garde-fou service worker : APRÈS le build, car il inspecte l'artefact livré
      # et non la configuration — la valeur fautive venait du plugin, pas d'une ligne
      # écrite à la main. Le 26/07/2026, `vite-plugin-pwa` a généré une URL relative
      # (`./sw.js`) : enregistrement en 404 sur toute route imbriquée, donc plus aucun
      # service worker en production, sans le moindre signal.
      - name: Lint service worker (URL absolue)
        working-directory: front
        run: npm run lint:sw

      # Garde-fou P3 : APRÈS le build, pour la même raison que celui du service
      # worker — il inspecte l'ARTEFACT livré, pas une ligne de configuration.
      #
      # 🔴 P3 est le contrôle du post-check qui prouve qu'un déploiement a eu
      # lieu : il lit la version dans le bundle que le navigateur reçoit. Son
      # ancrage était le NOM du paquet (`"hostachy-front",VAR="x.y.z"`), choisi
      # en 2026 au motif qu'il « survit à la minification ». Rollup élague
      # désormais l'import JSON du layout : le nom a disparu, le bundle ne porte
      # plus que `const fn="3.20.0",hn={version:fn}`, et P3 a rendu INCONNU à la
      # MEP v3.20.0 — la version a dû être retrouvée à la main.
      #
      # Il a échoué du BON côté (jamais un faux vert). Le vrai défaut est que
      # RIEN ne regardait si son ancrage marchait encore : le premier à
      # l'apprendre était le post-check, en production, une fois la MEP faite.
      # Cette étape exerce l'extracteur sur le build local et exige qu'il y
      # retrouve la version de `package.json` — donc la prochaine évolution de la
      # chaîne d'outils échoue ICI, avant la MEP, et non en production après.
      - name: Version lisible dans le bundle (l'extracteur de P3 mesure encore)
        working-directory: front
        run: npm run lint:version-servie

      # 🔒 Ce qu'un écran télécharge AVANT de s'afficher (04/10/2026). APRÈS le
      # build, comme les deux précédents : il lit le manifeste de Vite. L'éditeur
      # riche (Tiptap, 121 Ko compressés) entrait dans le chargement initial de
      # chaque écran portant un formulaire, même replié, et l'« Ouverture du
      # site » de la télémétrie dépassait la seconde. Un import statique qui le
      # ramènerait ne casse rien de visible — l'écran est seulement plus lent.
      - name: Rien de chargé d'emblée qui doit l'être à la demande
        working-directory: front
        run: npm run lint:poids-ouverture

      # 🔒 `script-src` en mode BLOQUANT tient à SIX LIGNES de `svelte.config.js`
      # (#770, 06/09/2026) : c'est SvelteKit qui émet `script-src 'self'
      # 'sha256-…'`, parce que lui seul connaît le contenu de ses scripts
      # d'hydratation. Rien n'obligeait ces lignes à rester là.
      #
      # Le contrôle DÉMARRE le serveur construit et lit l'en-tête d'une vraie
      # réponse — pas la configuration. La v2.24.0 avait livré un bandeau PWA
      # « vérifié » sur des artefacts corrects pendant que le service worker ne
      # s'enregistrait plus : un artefact ne prouve rien sur le comportement.
      #
      # Il vérifie aussi le `Caddyfile`, et c'est indissociable : sans le `+`
      # devant `Content-Security-Policy`, Caddy ÉCRASE l'en-tête de SvelteKit,
      # les condensats sont perdus et le site devient blanc. Aucune des deux
      # moitiés ne se voit depuis l'autre.
      - name: CSP servie (script-src bloquant, condensats préservés)
        working-directory: front
        run: npm run lint:csp

      # ♿ Le lien d'évitement clavier (#778, WCAG 2.4.1) tient à QUATRE pièces —
      # le lien, l'ancre, `tabindex="-1"` sur la cible, la bascule CSS au focus —
      # et aucune ne voit les autres. Deux de ses modes d'échec laissent le HTML
      # parfaitement correct pendant que la fonctionnalité est morte : c'est le
      # bandeau PWA de la v2.24.0, à nouveau.
      - name: Lien d'évitement clavier cohérent
        working-directory: front
        run: npm run lint:evitement

      # 🔴 La règle du seuil des listes courtes existe depuis le 29/08/2026
      # (`ux-patterns`, #491) et n'a PAS été appliquée au filtre « type » des
      # petites annonces — trois valeurs en <select> — pendant huit jours.
      # Personne ne l'a vu : une règle écrite dans une skill ne se relit pas avant
      # de toucher un écran qu'on croit sans rapport.
      #
      # Même motif que `EnteteCarte`, `ChoixPastilles` et `parse_json_perimetres` :
      # le composant existait, la règle existait, et rien ne les faisait appliquer.
      - name: Seuil des listes courtes (pastilles vs select)
        working-directory: front
        run: npm run lint:seuil-listes

      # 🔴 Le client TypeScript est la SEULE porte d'entrée de l'API (#801).
      # Le ticket relevait « 48 méthodes que personne n'appelle » ; le tri a montré
      # que la moitié n'était pas morte mais CONTOURNÉE — l'écran écrivait la route
      # à la main pendant que la méthode existait deux fichiers plus loin. Trois
      # recopies comptaient vraiment : `accueil-arrivant` était écrit TROIS fois,
      # corps compris, et il déclenche des e-mails.
      #
      # ⚠️ ZÉRO exception, et c'est le moment qui le permet : le contrôle est posé
      # APRÈS que le compte soit tombé à zéro. Une liste de tolérances posée avant
      # le tri aurait figé 38 cas — et une tolérance qui ne sert plus finit par en
      # couvrir une qui compte.
      - name: Le client TypeScript est la seule porte d'entrée de l'API
        working-directory: front
        run: npm run lint:client-api

      # 🔴 Le pendant du contrôle ci-dessus, dans l'autre sens : une méthode du
      # client que personne n'appelle doit se DÉCLARER (#801).
      #
      # Il n'interdit pas — le tri a montré que les neuf restantes ne sont pas du
      # code mort mais des capacités inatteignables, des appelants hors écran, ou
      # un geste retiré sur arbitrage. Interdire aurait forcé à supprimer des
      # capacités réelles ; tolérer en silence aurait laissé revenir les 48.
      # `@sans-appelant` exige en plus un numéro de ticket : une capacité
      # inatteignable sans ticket est un oubli qui ressemble à une décision.
      - name: Toute méthode du client est appelée, ou déclarée avec son motif
        working-directory: front
        run: npm run lint:client-appele

      # 🔴 L'infobulle d'un bouton icône est celle du NAVIGATEUR (`title`), son
      # NOM vient de `aria-label` (07/09/2026, arbitré à l'écran).
      #
      # Le projet avait sa propre bulle en CSS, lue depuis `data-info` : elle
      # s'ouvrait sous le bouton, là où arrive la flèche du pointeur. Elle a été
      # SUPPRIMÉE — « la bulle sombre est inutile, la claire est plus
      # pertinente ». Un `data-info` résiduel est donc un libellé que plus rien
      # n'affiche. Le contrôle a été inversé le jour même : il interdisait
      # `title`, il interdit maintenant `data-info`.
      #
      # ⚠️ La seconde règle, elle, ne dépendait d'aucun choix de bulle et
      # SURVIT : le relevé a montré que 31 boutons n'avaient QUE `title`, donc
      # aucun nom accessible, alors que la règle l'exige depuis toujours.
      # `lint:a11y` ne pouvait pas le voir — il lit `svelte-check`, qui ne
      # signale pas un bouton dont le contenu est un emoji. Et l'infobulle
      # native n'apparaît ni au clavier ni au tactile.
      - name: Infobulles et noms accessibles des boutons icône
        working-directory: front
        run: npm run lint:infobulles

      # 🔴 Une liste qui annonce « Aucun » doit avoir REGARDÉ.
      #
      # Le motif `{#if chargement}…{:else if liste.length === 0}` n'a que deux
      # branches : quand le chargement ÉCHOUE, la liste reste à `[]` et l'écran
      # affirme une absence qu'il n'a pas constatée. C'est #519 — deux sondages
      # et trois annonces crus détruits, et une demande de restauration au bout.
      #
      # ⚠️ `EtatListe` et `lint:catch-vide` existaient DÉJÀ pour cela, tous deux
      # verts, et le défaut était encore là onze fois : un try/catch qui se
      # contente d'un toast laisse la liste vide tout aussi silencieusement, et
      # le toast s'efface. Un composant que rien n'impose est un composant que
      # les écrans suivants réécrivent à la main.
      - name: Aucune liste n'annonce « aucun » sans avoir regardé
        working-directory: front
        run: npm run lint:etat-liste

      # 🔴 Le PREMIER des trois états, lui, n'était tenu par rien : le 24/09/2026,
      # vingt-trois écrans écrivaient encore leur propre « Chargement… », sous
      # cinq allures — dont une copie de la classe `.etat-chargement` d'EtatListe,
      # avec son style, dans une page (#1045). La skill affirmait qu'il n'en
      # restait aucun. Lance son `--selftest` avant de mesurer.
      - name: L'attente d'un écran se rend par EtatListe
        working-directory: front
        run: npm run lint:chargement

      # 🔴 La Suite d'un Bogue offrait Périmètre et Diffusion, que la déclaration
      # dit inactifs et que la création éteint : `sectionsDeLaSuite` les lisait
      # sans leurs motifs (#1321, 26/09/2026).
      - name: La Suite éteint ce que la création éteint
        working-directory: front
        run: npm run lint:suite-eteignable

      # Au doigt, `:hover` reste COLLÉ après un appui. 90 survols hors de
      # `@media (hover: hover)` le 26/09/2026 ; les 27 des feuilles communes
      # rangés le jour même. Plafond décroissant pour les 63 des composants.
      - name: Un survol ne sert qu'à la souris (plafond décroissant)
        working-directory: front
        run: npm run lint:survol

      # « NEW » rouge sur le fil, « Nouveau » gris ailleurs : deux badges pour une
      # notion (signalé à l'écran le 26/09/2026). Un seul, `BadgeNouveau`.
      - name: Le badge NEW se rend par son composant
        working-directory: front
        run: npm run lint:badge-nouveau

      # Trois pulsations décoratives tournaient sans fin sur les écrans les plus
      # vus (26/09/2026). Une animation sans fin ne dit plus qu'une ATTENTE.
      - name: Une animation sans fin ne dit qu'une attente
        working-directory: front
        run: npm run lint:animations-infinies

      # L'encart d'avertissement était recopié dans sept écrans, et
      # `.alert-warning` en portait un huitième aux couleurs en dur (#1455).
      - name: L'encart d'avertissement passe par son composant
        working-directory: front
        run: npm run lint:encart-avertissement

      # 🔴 Une affaire urgente portait DEUX badges « Urgente » sur sa carte
      # (27/09/2026, signalé à l'écran) : le badge de priorité et la rangée des
      # options, qui ne retirait que la confidentialité. Exécute `optionsEnBadge`.
      - name: Une option n'a qu'un badge sur une carte
        working-directory: front
        run: npm run lint:options-en-double

      # Les jetons de mouvement existaient depuis le 24/09/2026 ; trois jours plus
      # tard, 64 transitions sur 74 écrivaient leur durée (huit valeurs, 0,1 à
      # 0,4 s), et l'accueil entrait en 350 ms `ease` (27/09/2026, #1329).
      - name: Une durée de mouvement vient de la charte
        working-directory: front
        run: npm run lint:mouvement

      # 266 couleurs et 569 tailles de texte en dur dans les écrans, pour une
      # charte qui les nomme (#1055, 27/09/2026). Plafond décroissant : il
      # refuse d'en ajouter, et d'oublier de le baisser quand on en retire.
      - name: Couleurs et tailles de texte viennent de la charte
        working-directory: front
        run: npm run lint:charte-valeurs

      # 495 attributs `style="…"` statiques dans les écrans, dont quarante dans
      # un seul onglet sans aucune feuille (#1329, 28/09/2026). Plafond
      # décroissant : il refuse d'en ajouter, et d'oublier de le baisser.
      - name: Aucun style en ligne de plus
        working-directory: front
        run: npm run lint:styles-en-ligne

      # La dernière ligne d'une carte différait sur neuf points entre la carte
      # d'affaire, celle d'actualité et le fil (27/09/2026, arbitré à l'écran).
      # Une ligne : `PastillesAffaire` ; un auteur : `AuteurCarte` (✍️).
      - name: La dernière ligne d'une carte est la même partout
        working-directory: front
        run: npm run lint:pastilles

      # Le manuel montre les VRAIES pastilles « qui la lit », avec leur phrase au
      # survol (27/09/2026) : recalculées par `$lib/lecture`, jamais recopiées.
      - name: Les pastilles du manuel disent ce que le site dit
        working-directory: front
        run: npm run lint:manuel-pastilles

      # 🔴 L'infobulle de catégorie disait « etude_travaux » sur la liste des
      # affaires (26/09/2026, signalé à l'écran) ; deux reportings rendaient la
      # même valeur brute. Le libellé existait, rien n'obligeait à le prendre.
      # Étendu aux STATUTS le 26/09/2026 (#1345) : cinq écrans d'accès rendaient
      # « actif » ou « perdu » tels quels, et deux tables de badges avaient divergé.
      - name: Une catégorie ou un statut s'affiche par son libellé
        working-directory: front
        run: npm run lint:categorie-brute

      # 🔴 Le libellé d'un étage était écrit SEPT fois, en QUATRE rendus : un
      # lot au premier sous-sol s'affichait « -1 » sur `mon-lot`, « SS 1 » sur le
      # profil, et « Ét. -1 » dans une troisième forme de la même page.
      #
      # ⚠️ La septième a été trouvée PAR CE CONTRÔLE, pas par la relecture qui
      # l'a précédé : elle vivait dans une fonction et non dans un gabarit, et le
      # relevé fait à la main l'avait sautée. C'est la raison d'être de l'étape.
      - name: Libellé d'étage non réécrit dans un écran
        working-directory: front
        run: npm run lint:etage-libelle

      # Le libellé du TYPE d'un lot ne se recalcule pas dans un écran (#779,
      # 30/09/2026) : `lotTypeLabel` existait et six copies à la main divergeaient
      # d'elle (`local_commercial` brut, « T3 » tu). Même famille que l'étage.
      - name: Libellé du type de lot non réécrit dans un écran
        working-directory: front
        run: npm run lint:type-lot

      # Nom, adresse, décomptes de lots, année et immatriculation de la
      # copropriété : saisis par `ChampsIdentiteCopropriete` seul (#779,
      # 01/10/2026). La copie de la page Résidence ne savait pas effacer un
      # nombre — un champ vidé n'était pas envoyé.
      - name: Identité de la copropriété saisie une seule fois
        working-directory: front
        run: npm run lint:identite-copropriete

      # Le nom de CETTE résidence ne s'écrit pas dans le site (#1725) : la résidence
      # se lit dans sa configuration, la plateforme dans `$lib/plateforme`.
      - name: Nom de la résidence jamais écrit dans le site
        working-directory: front
        run: npm run lint:nom-residence

      # Le lien vers les consignes de la copropriété se rend par `LienConsignes`
      # seul (#779, 01/10/2026) : trois copies, deux libellés et deux icônes.
      - name: Lien vers les consignes écrit une seule fois
        working-directory: front
        run: npm run lint:lien-consignes

      # Les caractéristiques d'un lot (type, étage, superficie) : rendues par
      # `CaracteristiquesLot` seul (#779, 01/10/2026) — trois copies dans
      # « Mes lots », qui divergeaient sur les cas limites.
      - name: Caractéristiques d'un lot écrites une seule fois
        working-directory: front
        run: npm run lint:caracteristiques-lot

      # Une suppression définitive se confirme par `SUPPRESSION`
      # (`$lib/confirmation`) — deux modales écrites à la main avaient survécu
      # (bail, compte), #779.
      - name: Suppressions confirmées par la boîte partagée
        working-directory: front
        run: npm run lint:suppression-confirmee

      # Le libellé d'un état ne se recalcule pas depuis sa valeur brute
      # (`statut.replace('_', ' ')`) : le bail d'un locataire sortait toujours
      # vert, #779.
      - name: Libellés d'état lus dans leur table
        working-directory: front
        run: npm run lint:statut-recalcule

      # Une valeur saisie se convertit en nombre par `nombreOuNull` (#1516,
      # 01/10/2026). Un champ numérique vidé rend `null` : `v === '' ? null :
      # Number(v)` l'envoyait à 0 — un relevé de consommation à 0 m³.
      - name: Nombres saisis convertis par une seule règle
        working-directory: front
        run: npm run lint:nombre-saisi

      # Le nombre d'objets en vignette est `Compte.svelte` (10/10/2026) : le
      # badge des Archives était écrit deux fois, et avait déjà dérivé, quand
      # les pastilles de filtre d'Affaires s'apprêtaient à en écrire un troisième.
      - name: Vignettes de compte rendues par un seul composant
        working-directory: front
        run: npm run lint:vignette-compte

      # Une rangée de pastilles qui filtre une liste dit combien elle montre, sur
      # sa pastille retenue seulement (10/10/2026, maquette J) : la prop `compte`
      # oubliée ne casse rien, la rangée part simplement sans son nombre.
      - name: Rangées de filtres avec leur compte
        working-directory: front
        run: npm run lint:compte-filtres

      # 🔴 La note d'un prestataire était rendue CINQ fois, et l'une d'elles
      # colorait TOUTE note en orange : un 1/5 y paraissait comme un 3,5. La
      # teinte dit d'un coup d'œil si l'on est content de quelqu'un — là, elle
      # mentait.
      #
      # ⚠️ `starsDisplay` était déjà dans `$lib/utils` : la règle était
      # factorisée, son EMPLOI non — et c'est l'emploi qui porte les seuils,
      # donc le jugement. Même motif que #825.
      - name: Note de prestataire rendue à un seul endroit
        working-directory: front
        run: npm run lint:note-etoiles

      # 🔴 DOUZE points de rupture pour six intentions, et aucune échelle
      # déclarée (#839). Le cas net : `760px` était à SEPT pixels du `767px`
      # que la feuille globale emploie — entre 761 et 767, le menu était déjà
      # en mobile pendant que la rangée du calendrier restait en bureau.
      #
      # ⚠️ Un écart de sept pixels ne se VOIT pas : il se compte. C'est
      # exactement ce qu'une machine fait mieux qu'un regard.
      - name: Points de rupture issus de l'échelle déclarée
        working-directory: front
        run: npm run lint:points-rupture

      # 🔴 `EnteteCarte` porte le titre sur sa PROPRE ligne, le geste asymétrique
      # et l'ordre tags / date / actions / chevron. Onze cartes l'employaient ;
      # `CarteContrat` et `CartePrestataire`, non — et elles portaient exactement
      # les défauts qu'il supprime, dont l'ancien `role="button"` sur le conteneur,
      # remplacé partout ailleurs le 18/08.
      #
      # ⚠️ Personne ne l'a vu pendant un mois : rien ne relit une carte qu'on ne
      # touche pas, et les deux étaient cohérentes ENTRE ELLES. C'est la forme la
      # plus durable d'un écart — il faut une machine pour la voir.
      - name: En-tête de carte rendu par le composant partagé
        working-directory: front
        run: npm run lint:entete-carte

      # 🔴 Trois règles de la checklist qui n'avaient AUCUN garde-fou (#1045,
      # point 2). La mesure du 24/09/2026 en a trouvé quatre écarts vivants :
      # « 📍 Concerne votre bâtiment » et « 📍 Dépannage » (📍 est un LIEU, un
      # périmètre se dit 🔹), un badge 🔹 recopié qui affichait le périmètre par
      # défaut, et `icone="database"` rendu en point d'interrogation — `Icon`
      # retombe en silence sur `help-circle` : celui-là est tenu par
      # `lint:icones`, branché plus haut (#1264). Chacun lance son `--selftest`
      # avant de mesurer.
      - name: Pictogrammes de contexte — 📍 lieu, 🔹 périmètre
        working-directory: front
        run: npm run lint:pictogrammes

      - name: Troncature d'aperçu issue de normes.css
        working-directory: front
        run: npm run lint:clamp

      # Un type d'entité se déclare là où le client le rend, jamais dans un
      # écran (#1044) : sinon deux écrans retypent la même entité, et divergent.
      - name: Types d'entité déclarés hors des écrans
        working-directory: front
        run: npm run lint:types-locaux

      # 🔴 `e instanceof ApiError ? e.message : 'Erreur'` est écrit 123 fois.
      # Ce n'est pas une redite cosmétique : c'est la MÊME information perdue
      # 82 fois — `messageErreur` sait dire « votre session a expiré, rechargez
      # la page », le ternaire répond « Erreur ».
      #
      # ⚠️ Un PLAFOND, pas une interdiction : convertir 43 fichiers d'un coup,
      # sans regarder un seul écran, est le genre de lot que ce dépôt évite. Le
      # plafond empêche la 124ᵉ, et il DESCEND à chaque conversion.
      - name: Message d'erreur issu du helper partagé
        working-directory: front
        run: npm run lint:message-erreur

      # 🔴 Le pied « Annuler / Enregistrer » était écrit DIX-NEUF fois, et les
      # copies avaient divergé sur quatre points — dont TROIS orthographes du
      # même événement d'annulation : `annule`, `annuler`, `cancel`.
      #
      # ⚠️ Cette divergence-là ne lève jamais : un parent qui écoute `on:annule`
      # sur un formulaire qui émet `annuler` ne réagit pas. Le bouton semble
      # mort, sans erreur, sans trace.
      #
      # ⚠️ Mon relevé manuel n'en avait vu que neuf — je n'avais regardé que les
      # `Formulaire*.svelte`. Le contrôle, lui, balaie `src/`.
      - name: Pied de formulaire passant par le composant
        working-directory: front
        run: npm run lint:pied-formulaire

      # 🔴 La pastille d'un espace prend la couleur de son BÂTIMENT (12/09/2026).
      #
      # Sur le kanban, « Bât. 1 » était bleu clair et « Ascenseur », qui est DANS
      # le bâtiment 1, sortait rose : la teinte venait d'un condensat du code
      # entier. Signalé à l'écran — aucun contrôle ne pouvait le voir, et moi non
      # plus : les écrans sont derrière une connexion. La règle est donc une
      # fonction PURE, éprouvée sans navigateur.
      - name: Teinte d'une pastille de périmètre (héritée du 1er niveau)
        working-directory: front
        run: npm run lint:teinte

      # 🔴 L'ORDRE DES SECTIONS N'ÉTAIT TENU QUE PAR UNE DOCUMENTATION (12/09/2026).
      #
      # `ux-patterns` §9 sexies l'arbitre depuis longtemps, et `ChampsCommuns`
      # l'imposait — pour les sections 5 à 10 seulement. Les deux précédentes,
      # Options de publication et Workflow, étaient posées à la main par chaque
      # écran : elles ont divergé, et c'est l'utilisateur qui l'a vu.
      - name: Ordre des sections d'un formulaire
        working-directory: front
        run: npm run lint:ordre-sections

      # 🔴 LE PLIAGE N'ATTEIGNAIT PAS LES COMPOSANTS PORTEURS (22/09/2026).
      #
      # La table dit `pliee: true` pour Pieces jointes, et la section restait
      # depliee a l'ecran : `SectionsPiecesJointes`, `ChampSaisiPour` et
      # `SectionWorkflow` PORTENT leur section au lieu de l'ecrire dans la page,
      # et aucun ne recevait de prop `pliable` — le chemin n'existait pas.
      #
      # C'est l'angle mort deja paye par `lint:ordre-sections` : plus un ecran
      # suit la regle en deleguant a un composant, moins il est controle.
      # Signale deux fois par l'utilisateur avant qu'un controle le voie.
      - name: Le pliage atteint les composants porteurs de section
        working-directory: front
        run: npm run lint:pliage-transmis

      # LES FILTRES D'UNE LISTE PRECEDENT SA BOITE DE CREATION (#1186, 24/09/2026)
      #
      # `ux-patterns` §0 ter l'ecrivait depuis le 12/09 ; la Boite a idees et les
      # Petites annonces rendaient pourtant leur filtre SOUS le formulaire ouvert.
      # L'ecart ne se voit que la boite ouverte, donc jamais en relecture d'ecran.
      - name: Les filtres precedent la boite de creation
        working-directory: front
        run: npm run lint:filtre-avant-formulaire

      # UNE SECTION SE NOMME PAR SON TITRE, JAMAIS PAR UN LIBELLE DE CHAMP
      # (23/09/2026, signale a l'ecran : « TITRE » ne ressemblait pas aux autres
      # intitules). Sept formulaires ouvraient leur section 1 sans `titre=`,
      # avec un `<label>` de champ : deux typographies pour un meme role.
      # La section 1 vit desormais dans `SectionTitre`.
      - name: Une section se nomme par son titre
        working-directory: front
        run: npm run lint:section-nommee

      # 🔴 « ARIA-LABEL SUR LES BOUTONS ICONE-SEULE » ETAIT ECRIT TROIS FOIS
      # ET APPLIQUE ZERO (22/09/2026) : CLAUDE.md, ux-patterns §3, standards/11 §2.
      #
      # Mesure : en retirant l'aria-label d'un bouton icone fraichement ecrit,
      # `lint:a11y` est reste VERT. Il relaie les avertissements de svelte-check,
      # qui n'a pas de regle « bouton sans nom accessible » — il ne la trouve donc
      # jamais. Dix-neuf boutons etaient muets, dont les huit de la barre de
      # l'editeur riche : un lecteur d'ecran annonce « bouton », et rien d'autre.
      #
      # ⚠️ `title` ne compte pas : il ne s'affiche qu'au survol, donc jamais au
      # doigt ni au clavier.
      - name: Un bouton icone-seule dit ce qu'il fait
        working-directory: front
        run: npm run lint:bouton-icone

      # 🔴 DIX FICHIERS ÉNUMÉRAIENT LE MÊME ENSEMBLE D'ÉTATS DEUX OU TROIS FOIS
      # (15/09/2026, #779) — un libellé ici, une pastille là, un abrégé plus bas.
      #
      # Aucune ne divergeait encore : c'est exactement l'état des quatre copies
      # des statuts de ticket avant #415, « chacune cohérente avec elle-même ».
      # Une clé oubliée dans l'une rend `undefined`, donc un badge sans couleur —
      # rien ne lève, rien ne se voit. Les tables ont fondu (`$lib/table-statuts`),
      # et ce contrôle interdit d'en rouvrir une paire.
      - name: Une table d'états n'est pas énumérée deux fois
        working-directory: front
        run: npm run lint:tables-statuts

      # Les statuts d'un accès ne s'écrivent que dans `$lib/types-acces` (#1575,
      # 02/10/2026) : le formulaire en gardait une table à lui, « ✅ Actif » où
      # tous les autres écrans disaient « Actif ». Le contrôle précédent ne
      # compare que deux tables d'un même fichier ; celle-ci était seule.
      - name: Statuts d'accès écrits une seule fois
        working-directory: front
        run: npm run lint:statuts-acces

      # 🔴 LE LOCK MENTAIT SUR DEUX DÉPENDANCES DEPUIS QUINZE VERSIONS (15/09/2026).
      #
      # `prosemirror-transform` y suivait le numéro de version de l'APPLICATION —
      # 1.16.2, 1.17.0, … 1.28.0 — parce que le bump se faisait par remplacement
      # de chaîne et que cette dépendance portait par hasard le même numéro.
      # Aucune de ces versions n'a jamais été publiée.
      #
      # La production n'a jamais été cassée : `npm ci` suit `resolved` et son
      # empreinte, qui désignaient les vraies archives. Mais `npm audit` lit
      # `version` : il évaluait les avis contre une version inexistante et rendait
      # « 0 vulnérabilité » SANS avoir examiné ces paquets.
      - name: Le lock ne ment pas sur ses versions
        working-directory: front
        run: npm run lint:lock

      # 🔴 DEUX COPIES SUR CINQ AVAIENT DIVERGÉ SUR CE QU'ON NE VOIT PAS (18/09/2026).
      #
      # Le dépliement Unicode qui retire les accents était recopié cinq fois :
      # deux dans l'Espace CS, une dans la FAQ, deux pour fabriquer un code.
      # Quatre écrivaient la plage des signes combinants en échappements, la
      # cinquième avec les caractères eux-mêmes — des accents flottants qu'aucun
      # éditeur ne montre et qu'un changement d'encodage emporte sans un mot.
      #
      # Une plage vidée ne lève aucune erreur : elle ne retire plus rien, et deux
      # textes cessent simplement de correspondre.
      - name: Le dépliement des accents ne s'écrit qu'à un endroit
        working-directory: front
        run: npm run lint:texte

      # 🔴 LA FICHE DU SYNDIC N'AVAIT PAS DE PIED DE FORMULAIRE (18/09/2026, #779).
      #
      # L'Espace CS rendait DEUX fiches modifiables — le membre du conseil
      # syndical, celui du syndic — recopiées au caractère près. Et les copies
      # avaient divergé sur ce qui coûte : côté syndic, on entrait en édition par
      # le crayon et on ne pouvait en sortir que par lui, « Annuler » n'existant
      # pas. Une différence qui ne se voit pas en relisant l'un des deux blocs :
      # il faut les comparer, à cent cinquante lignes d'écart.
      - name: L'identité d'un membre se saisit dans le composant partagé
        working-directory: front
        run: npm run lint:identite

      # Un objet « Saisi pour » appartient à celui pour QUI il a été ouvert, pas
      # à celui qui a tapé (arbitrage du 12/09/2026). La carte d'affaire
      # annonçait pourtant le rédacteur, alors que le MÊME composant employait
      # le bon nom dans sa case de copie — un écran, deux noms.
      #
      # Le contrôle lit les types porteurs dans `types.ts` (ceux qui héritent de
      # `PorteSaisiPourLu`) : une liste recopiée ici aurait divergé au premier
      # type ajouté, et c'est le type ajouté qui n'aurait eu aucun garde-fou.
      - name: Un objet « Saisi pour » affiche son propriétaire, pas son auteur
        working-directory: front
        run: npm run lint:nom-proprietaire

      # Les épreuves du contrôle lui-même : un motif trop étroit, une exception
      # qui survit à son objet, un commentaire pris pour du code — trois façons
      # d'être vert à tort, toutes déjà vues ici.
      - name: Le contrôle du propriétaire s'éprouve lui-même
        working-directory: front
        run: node scripts/check-nom-proprietaire.mjs --selftest

      # Une surcharge de page ABSENTE doit retomber sur `pages.ts`, jamais
      # effacer. Trois entrées de « Descriptif pages » s'affichaient sans nom :
      # l'écran partait de l'enregistrement, qui ne porte pas `nom` — ce champ
      # n'étant pas administrable, il n'y figure jamais.
      #
      # Le front n'a pas de lanceur de tests : c'est le pattern de
      # `check-liste-depliable.mjs` — fonction pure + selftest, sur le module
      # que le site embarque, pas une copie.
      - name: Une surcharge de page absente retombe sur la source
        working-directory: front
        run: npm run lint:pages-surcharge

      # « Publication » et « Ticket » sont des noms de MODÈLE ; l'écran dit
      # « Actualité » et « Affaire ». Le renommage v2.1.0 a traité les écrans,
      # la FAQ, le README et le manuel — pas les VERBES D'ACTION : le mot de
      # code avait fui jusqu'au bouton, vingt fois dans seize fichiers.
      #
      # La liste des mots surveillés se LIT dans `lib/entites/*.ts` (`motDeCode`),
      # jamais recopiée ici : un troisième renommage n'ajoutera qu'une ligne à
      # sa déclaration. Complète `test_vocabulaire_affaire.py`, qui lit les
      # sources de texte servi et déclare ne pas lire les .svelte.
      - name: Le mot du modèle ne sort pas dans un libellé
        working-directory: front
        run: npm run lint:vocabulaire-ecran

      - name: Le contrôle du vocabulaire s'éprouve lui-même
        working-directory: front
        run: node scripts/check-vocabulaire-ecran.mjs --selftest

      # ──────────────────────────────────────────────────────────────────────
      # Une catégorie d'affaire ne se PRÉSÉLECTIONNE pas (21/09/2026)
      #
      # « Panne » était cochée à l'ouverture du formulaire : enregistrer sans y
      # toucher classait l'affaire en panne, alors que la catégorie décide de
      # QUI traite. La liste des catégories se lit dans `lib/tickets.ts`
      # (`CATEGORIES_TICKET`), jamais recopiée ici.
      - name: Aucune catégorie d'affaire présélectionnée
        working-directory: front
        run: npm run lint:choix-requis

      - name: Le contrôle de la catégorie s'éprouve lui-même
        working-directory: front
        run: node scripts/check-choix-requis.mjs --selftest

      # ──────────────────────────────────────────────────────────────────────
      # Un onglet `.tab-btn` ne vit que dans Onglet / BarreOnglets (23/09/2026)
      # « Au nom de » rendait trois `.tab-btn` à coins carrés, dans un cadre,
      # restylés localement : un choix de formulaire passe par ChoixPastilles
      # (#1160, signalé à l'écran).
      - name: Aucun onglet rendu hors des composants d'onglets
        working-directory: front
        run: npm run lint:onglet-local

      - name: Le contrôle des onglets s'éprouve lui-même
        working-directory: front
        run: node scripts/check-onglet-local.mjs --selftest

      # ──────────────────────────────────────────────────────────────────────
      # Une exception de la page fait échouer le test e2e (01/10/2026)
      # `deconnexion.spec` tombait au hasard : une exception — l'API simulée
      # rendait `[]` pour le fil — figeait le titre, et personne ne l'écoutait.
      # Le `test` de `e2e/aides.ts` la refuse ; un spec qui prendrait celui de
      # Playwright y échapperait (#1475).
      - name: Les tests de navigateur prennent le test qui refuse les exceptions
        working-directory: front
        run: npm run lint:e2e-test

      - name: Le contrôle du test e2e s'éprouve lui-même
        working-directory: front
        run: node scripts/check-e2e-test.mjs --selftest

      # ──────────────────────────────────────────────────────────────────────
      # Un intitulé de section du cadre ne s'écrit pas en dur (22/09/2026)
      #
      # `ChampSaisiPour` affichait « SAISI POUR » quand la table déclare
      # « Au nom de » : deux noms pour une section, dont un seul est déclaré.
      - name: Intitulés de section lus dans la table
        working-directory: front
        run: npm run lint:intitules-section

      # ──────────────────────────────────────────────────────────────────────
      # Une prop de section lit LA section qu'elle active (#1095, 22/09/2026)
      #
      # « Au nom de » (10) et « Mise en avant » (11) étaient conditionnées à
      # « Nature » (2) — reliquat de l'ancienne section « Champs spécifiques ».
      # Leur déclaration n'était donc lue par personne.
      - name: Chaque prop de section lit sa propre section
        working-directory: front
        run: npm run lint:section-lue

      - name: Le contrôle des sections lues s'éprouve lui-même
        working-directory: front
        run: node scripts/check-section-lue.mjs --selftest

  # ══════════════════════════════════════════════════════════════════════════
  # 🔴 LES TESTS DE NAVIGATEUR NE TOURNAIENT NULLE PART (#839, 08/09/2026)
  #
  # `front/e2e/` existe depuis le 06/09 et porte seize cas — squelette, lien
  # d'évitement, absence de défilement horizontal, erreurs de script au
  # chargement — sur les profils bureau ET mobile. Aucun job ne les lançait.
  #
  # C'est la forme la plus discrète du faux vert : le dépôt CONTIENT les tests,
  # `npm run e2e` les passe sur le poste de qui y pense, et les quatre checks
  # requis restent verts si l'un d'eux casse. « Un contrôle qui ne peut pas
  # s'exécuter renvoie INCONNU, jamais OK » (`standards/04` §1) — ici il ne
  # s'exécutait pas du tout, et personne ne le savait.
  #
  # ⚠️ C'est la même famille que #409, #410 et #411, citées plus haut dans ce
  # fichier : des contrôles qui existent et ne tournent pas. Le motif se répète
  # parce qu'écrire un test et le BRANCHER sont deux gestes, et que le second
  # ne manque à personne.
  #
  # ⚠️ Job à part et non une étape de `build-frontend` : il lui faut les
  # navigateurs de Playwright (~300 Mo) et un serveur qui démarre. Les mêler
  # ferait payer ce temps à chaque lint de style.
  # ══════════════════════════════════════════════════════════════════════════
  e2e-frontend:
    name: Tests de navigateur (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: front
        # `npm ci`, comme `front/Dockerfile` (#1050) : `npm install` re-résolvait
        # les plages et réécrivait le lock — la CI validait donc un arbre que
        # l'image ne construisait pas. `--legacy-peer-deps` : le même drapeau que
        # l'image — la CI doit installer exactement comme elle.
        run: npm ci --legacy-peer-deps

      # Chromium seul : les deux profils (bureau et mobile) l'emploient, et
      # installer Firefox et WebKit pour rien coûterait deux minutes par PR.
      - name: Install Playwright browsers
        working-directory: front
        run: |
          #  🔴 Le dépôt Google Chrome de l'image GitHub sert par moments un index
          #  CORROMPU (« Hash Sum mismatch » sur `Packages.gz`, 09/09/2026). Comme
          #  `--with-deps` commence par un `apt-get update`, celui-ci échoue en 100
          #  et l'installation s'arrête — les tests ne démarrent même pas, et la
          #  PR est bloquée par un check rouge qui ne dit rien du code.
          #
          #  Ce dépôt ne sert à RIEN ici : Playwright installe ses dépendances
          #  depuis les dépôts Ubuntu, et le navigateur vient de son propre CDN.
          #  On le retire donc avant, plutôt que de réessayer en espérant.
          #
          #  ⚠️ Un GLOB, et non le seul `.list` : l'image déclare ce dépôt en
          #  deb822 (`google-chrome.sources`) selon sa génération, et viser le
          #  mauvais nom laisse l'index corrompu en place — ce qui s'est vu, le
          #  premier correctif n'ayant rien changé.
          #
          #  ⚠️ `if`, et non `&& ` : sous `bash -e`, une condition fausse en tête
          #  de ligne ferait échouer l'étape — et elle est fausse sur le poste,
          #  où `rejouer-ci.sh` rejoue cette même commande.
          if [ -d /etc/apt/sources.list.d ]; then
            sudo rm -f /etc/apt/sources.list.d/google-chrome*
            ls -1 /etc/apt/sources.list.d/ || true
          fi
          npx playwright install --with-deps chromium

      # 🔴 Avant les tests, pas après : un serveur emprunté les ferait passer
      # sur le code d'un autre (#1150). Voir l'en-tête du script.
      - name: Les tests de navigateur lancent leur serveur, jamais un emprunté
        working-directory: front
        run: npm run lint:e2e-serveur

      - name: Tests de navigateur (bureau et mobile)
        working-directory: front
        # 🔒 Aucun rechargement de Vite pendant les tests (#1421, 28/09/2026). À
        # cache froid, une dépendance chargée par un `import()` dynamique n'est
        # découverte qu'au premier écran qui l'appelle : Vite l'optimise, puis
        # RECHARGE toutes les pages ouvertes, et les tests en vol échouent au
        # hasard (« Execution context was destroyed »). Quatre rejeux complets sur
        # six l'avaient subi. La dépendance nommée va dans `optimizeDeps.include`.
        run: |
          set +e
          npm run e2e 2>&1 | tee e2e-sortie.log
          code=${PIPESTATUS[0]}
          if grep -q "optimized dependencies changed" e2e-sortie.log; then
            grep "new dependencies optimized" e2e-sortie.log
            echo "✗ Vite a rechargé la page pendant les tests : ajouter la dépendance ci-dessus à optimizeDeps.include (vite.config.ts)."
            exit 1
          fi
          exit $code
