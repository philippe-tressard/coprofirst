name: CI

#  ⚠️ `push` ne porte QUE `main`, et c'est délibéré (19/08/2026).
#
#  Avant : `push: [main, dev]` + `pull_request: [main, dev]`. Un commit poussé sur
#  `dev` puis mis en PR vers `main` déclenchait DEUX exécutions complètes du même
#  workflow sur le MÊME sha — soit huit jobs pour quatre checks utiles. Les runners
#  saturaient, « Tests Python » (qui installe pango/cairo par apt-get) partait en
#  file d'attente, et la PR restait BLOCKED en attendant un exemplaire redondant
#  d'un job déjà passé au vert quelques minutes plus tôt.
#
#  La protection de branche exige les checks de l'événement `pull_request` : c'est
#  donc celui-là qu'il faut garder. Le run `push` sur `dev` ne servait à rien que
#  personne d'autre ne fasse déjà — `scripts/poste/rejouer-ci.sh` rejoue les mêmes
#  commandes AVANT le push (point 16 du pré-check, obligatoire).
#
#  Le point 0c du pré-check continue de fonctionner : `gh run list --branch dev`
#  remonte aussi les exécutions `pull_request`, dont la branche de tête est `dev`.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

#  Un réalignement de `dev` (force-push après un squash) laissait tourner le run de
#  l'ancien head : GitHub finissait par l'annuler, et un check requis restait
#  « cancelled » — donc jamais satisfait, donc PR bloquée. Trois occurrences sur les
#  huit derniers runs du 19/08.
#
#  Le groupe distingue la PR de la branche : deux contextes différents ne
#  s'annulent jamais l'un l'autre, seul un run DEVENU OBSOLÈTE est interrompu.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

#  Droits du jeton, écrits au lieu d'être hérités du réglage du dépôt (#1584) :
#  `default_workflow_permissions: read` les garde aujourd'hui, mais un réglage
#  qui change sans qu'un octet du dépôt bouge n'est pas un contrôle. AUCUN job
#  n'écrit (ni `gh`, ni `GITHUB_TOKEN`, ni `secrets.`, ni push, ni commentaire
#  de PR, ni dépôt d'artefact par API) : la lecture du contenu suffit au
#  `checkout` — et à l'étape du descriptif (#1771), seule à passer le jeton,
#  pour LIRE le dépôt. Un job qui devra écrire déclarera SA permission, dans le job.
permissions:
  contents: read

#  ⚠️ Tout job porte un `timeout-minutes` (18/08/2026). Sans lui, GitHub laisse
#  pendre jusqu'à SIX HEURES : le 18/08, « Tests Python » est resté bloqué deux
#  fois sur l'installation des bibliothèques système PDF (apt-get), et comme ce
#  check est requis, la PR est restée « BLOCKED » sans qu'aucun échec ne soit
#  signalé. Un job qui PEND ne dit rien ; un job qui ÉCHOUE se relance d'un clic.
#  C'est la règle du projet : un contrôle qui ne peut pas s'exécuter doit le DIRE
#  (`standards/04`, INCONNU jamais OK). Les durées observées vont de 7 s à 57 s.

jobs:
  # ── Backend: lint Python avec Ruff ───────────────────────────
  lint-backend:
    name: Lint Python (Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install Ruff
        # ÉPINGLÉ depuis le 24/09/2026 (#1048) : `ruff format --check` compare le
        # code au style de LA version installée, et Ruff change son style de
        # formatage chaque année. Non épinglé, le job passerait au rouge un
        # matin sans qu'un octet du dépôt ait bougé. Monter la version = un
        # lot dédié : `pip install ruff==X`, `ruff format api/`, commit seul.
        run: pip install ruff==0.15.8

      # 🔴 PREMIÈRE MESURE DES DÉPENDANCES PYTHON (#537, 20/08/2026).
      #
      # La passe de sécurité du 20/08 couvrait les dix points de l'OWASP Top 10.
      # NEUF ont été mesurés ; le dixième ne l'a pas été — `pip-audit` n'était
      # installé nulle part. Le versant Node l'était depuis #411 : deux moitiés
      # du même contrôle, dont une seule existait.
      #
      # ⚠️ Un audit qui ne peut pas s'exécuter rend INCONNU et sort en 2 — jamais
      # OK. C'est exactement le défaut que ce ticket corrigeait.
      - name: Installer pip-audit
        # ÉPINGLÉ le 02/10/2026 (#1584) : le verdict d'audit dépendait du jour où
        # l'outil se résolvait. 🔒 `test_ci_installations_epinglees.py` refuse tout
        # `pip install` non épinglé dans ce fichier. Monter la version = un lot
        # dédié, qui relit le rapport de `check_audit_python.py`.
        run: pip install pip-audit==2.10.1

      # La première exécution a trouvé une vulnérabilité RÉELLE : PYSEC-2026-3552
      # sur `cryptography` 49.0.0 — un oracle de Bleichenbacher sur le
      # déchiffrement PKCS#7. Elle est TOLÉRÉE, pas ignorée : `fastapi-mail`
      # épingle `cryptography <50.0.0` et sa 1.6.5 est la dernière publiée, donc
      # aucun correctif n'est atteignable ; et ce dépôt n'appelle aucune des trois
      # fonctions concernées — vérifié, pas supposé.
      #
      # Chaque exception nomme son avis, son motif, sa condition de levée et sa
      # date de revue. Elle EXPIRE, et une exception devenue inutile fait échouer
      # le contrôle pour forcer son retrait. Même mécanique que `lint:audit` côté
      # front — un contrôle sans porte de sortie finit désactivé la semaine où un
      # avis non corrigeable bloque toutes les PR.
      - name: Audit des dépendances Python (exceptions nominatives)
        working-directory: api
        run: python scripts/check_audit_python.py

      - name: Conformité des licences (REUSE)
        # 🔴 RANG 1 (`standards/14`) — et il n'était vérifié NULLE PART jusqu'au
        # 05/09/2026 (#774). Le projet EST conforme : `reuse lint` compte 913
        # fichiers sur 913 couverts, par le motif `**` de `REUSE.toml`. Ce qui
        # manquait, c'est le contrôle : une conformité que rien ne mesure dérive
        # au premier fichier ajouté hors du motif — et personne ne le saurait.
        #
        # ⚠️ Le format `dep5` employé jusqu'ici est DÉPRÉCIÉ par REUSE 3.2. Il a
        # été converti en `REUSE.toml` le même jour : garder un format que
        # l'outil ne lira plus, c'est programmer la panne du contrôle qu'on vient
        # de poser.
        #
        # ⚠️ `python -m reuse` et non `reuse` : l'exécutable posé par pip n'est pas
        # dans le PATH d'un poste Windows, et le rejeu local rendait INCONNU —
        # c'est-à-dire ni vert ni rouge, donc un contrôle qu'on ne peut pas
        # relire avant de pousser. Le module, lui, s'appelle partout pareil.
        #
        # ÉPINGLÉ le 02/10/2026 (#1543) : l'étape suivante lit `reuse lint --json`,
        # dont le format suit la version de l'outil.
        run: |
          python -m pip install reuse==6.2.0
          python -m reuse lint

      # `reuse lint` vérifie qu'une licence est DÉCLARÉE pour chaque fichier, pas
      # qu'elle est vraie : les tracés Lucide recopiés passaient sous la licence
      # du projet (#1543). Le détail : l'en-tête de `scripts/ci/contenus_tiers.py`.
      - name: Contenus tiers attribués à leur licence (REUSE)
        run: python scripts/ci/contenus_tiers.py

      # Le descriptif « About » du dépôt ne vit pas dans le dépôt : il disait
      # « Licence 5Hostachy (source-available…) » un jour après le passage à
      # l'AGPL (#1771). Son texte est versionné et jugé par
      # `test_gouvernance_depot.py` ; ici, GitHub doit afficher CE texte, et
      # détecter la licence de REUSE.toml. Le jeton ne sert qu'à LIRE.
      - name: Descriptif et licence affichés par GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/ci/descriptif_depot.py --selftest
          python scripts/ci/descriptif_depot.py

      - name: Run Ruff
        # F401 (import inutilisé) sur `app/` seulement, ajouté le 08/08/2026 :
        # ce n'est pas du style. Une factorisation se termine par la suppression
        # de ce qu'elle a remplacé (socle 02 §5), et l'import orphelin est le
        # résidu le plus fréquent — 26 traînaient dans `app/`, dont deux que je
        # venais de créer en ré-exportant des périmètres que plus personne
        # n'importait. Ruff respecte `__all__` : les ré-exports voulus des
        # paquets découpés (`admin/`, `flux/`, `tickets/`) ne sont pas touchés.
        #
        # `alembic/` en est EXCLU volontairement : quatre migrations portent des
        # imports inutiles, et une migration déjà appliquée ne se modifie jamais
        # (CLAUDE.md). Les corriger pour satisfaire un linter réécrirait
        # l'historique du schéma — le remède serait pire que le défaut.
        # S608 (SQL construit par chaînes) sur `app/` SEULEMENT, depuis le
        # 19/09/2026 (#1032). Deux occurrences existaient, toutes deux
        # légitimes — `diagnostic_cles.py` interpole un nom de table, ce que
        # SQLite ne sait pas lier — et aucune n'était DÉCLARÉE : elles portent
        # maintenant un `noqa: S608` avec leur raison.
        #
        # 🔴 PAS sur `alembic/`, et ce n'est pas un oubli : 23 migrations y
        # construisent du SQL par f-string, et **une migration appliquée ne se
        # modifie jamais**. Y ajouter 23 `noqa` serait modifier l'historique du
        # schéma pour satisfaire un linter — le remède serait pire que le
        # défaut, comme pour F401 juste au-dessus.
        #
        # Ce qui couvre les migrations, c'est `test_migrations.py` :
        # `test_aucune_NOUVELLE_fstring_sans_bindparams` refuse la 28ᵉ, avec la
        # liste des 27 d'avant FIGÉE — de l'historique, pas une tolérance.
        #
        # `tests/` depuis le 24/09/2026 (#1048) : la CI n'y passait AUCUNE règle,
        # et `test_verrou_bascule.py` employait `nl` sans le définir. Le message
        # d'un `assert` n'est évalué qu'en cas d'échec : le test était vert, et
        # aurait levé `NameError` au lieu de son rapport le jour où il attrapait
        # une recopie — un contrôle qui ne peut pas rendre son verdict.
        # Même jeu « erreurs réelles » qu'`alembic/`, et rien de plus :
        # 🔴 F811 est ÉCARTÉ exprès — pytest injecte une fixture (`session`,
        # `scene`) sous le nom de la fonction qui la déclare, et Ruff y lit ~70
        # redéfinitions qui n'en sont pas. Les « corriger » casserait les tests.
        #
        # F811, F841, E711, E712 partout depuis le 24/09/2026 (#1048, point 2).
        # Ce ne sont pas des règles de style : un import redoublé, une variable
        # jamais lue, c'est le résidu d'une factorisation inachevée.
        # 🔴 E711/E712 dans une requête SQLAlchemy (`Model.actif == True`,
        # `Model.x != None`) : le remède que Ruff propose (`is True`, `is not
        # None`) compare l'OBJET colonne en Python et rend un booléen constant —
        # le filtre disparaît sans un mot. La forme du dépôt est `# noqa: E712`
        # (ou E711) sur la ligne ; elle existait déjà 41 fois.
        # F811 reste hors de `tests/` : pytest injecte une fixture (`session`,
        # `scene`) sous le nom de la fonction qui la déclare — ~70 faux positifs.
        # `alembic/` passe ces quatre règles sans qu'une migration soit touchée.
        #
        # F401 sur `tests/` depuis le 25/09/2026 (#1273) : les 45 imports inutiles
        # ont été relus un à un. Aucun n'enregistrait un modèle ni ne prouvait
        # l'existence d'un symbole (`app.models.core` est importé partout).
        # E741 (`l`, `O`, `I`) et E731 (`lambda` assignée) partout, même lot :
        # 27 `l` renommés, `SessionLocal` devenue une vraie fonction.
        # 🔴 E402 reste DEHORS, et c'est une décision : l'ordre des imports y est
        # du comportement. `main.py` pose le correctif UTC avant d'importer les
        # routeurs, `core.py` ré-exporte pour ENREGISTRER les tables (#1157),
        # des imports tardifs cassent des cycles, et 39 des 70 sont dans des
        # migrations qu'on ne modifie jamais. Les déplacer pour un linter
        # changerait le démarrage de l'API sans rien corriger.
        # DTZ003 (`datetime.utcnow()`) sur `app/` seulement (#1047, 25/09/2026) :
        # déprécié depuis Python 3.12, l'image de l'API. L'heure passe par
        # `utils/horloge.maintenant()`, qui rend le même UTC naïf. Les tests et
        # les migrations le gardent : ils ne tournent pas en production, et une
        # migration appliquée ne se modifie jamais.
        # DTZ005/006/011 (`datetime.now()`, `fromtimestamp()` sans fuseau,
        # `date.today()`) depuis #1565 (02/10/2026) : l'heure et le jour du
        # CONTENEUR. Le jour du résident est `horloge.aujourd_hui()` (Paris),
        # l'instant de la base `horloge.maintenant()`. Ruff ne voit que les
        # appels : `default_factory=date.today` est refusé par `test_horloge.py`.
        run: |
          ruff check api/app/ --select E9,F63,F7,F82,F401,S608,F811,F841,E711,E712,E741,E731,DTZ003,DTZ005,DTZ006,DTZ011,W605
          ruff check api/alembic/ --select E9,F63,F7,F82,F811,F841,E711,E712,E741,E731,W605
          ruff check api/tests/ --select E9,F63,F7,F82,F401,F841,E711,E712,E741,E731,W605

      - name: Ruff format (API)
        # Depuis le 24/09/2026 (#1048) : aucun formateur n'était en usage côté
        # API, alors que le front passe Prettier. Le formatage a été appliqué
        # en UN commit, seul — relire son diff n'a de sens que s'il ne porte
        # rien d'autre.
        # La configuration (largeur 100, migrations exclues) vit dans
        # `api/ruff.toml` : l'exécuter ailleurs que depuis `api/` la lit aussi.
        # ⚠️ Le formatage DÉPLACE un commentaire de fin de ligne quand il coupe
        # la ligne : un `# noqa` peut quitter la ligne qu'il vise. `ruff check`
        # juste au-dessus le voit — c'est ce qui a été corrigé six fois ici.
        run: ruff format --check api/
        # On garde un garde-fou « erreurs réelles » (syntaxe, noms invalides, runtime)
        # sans bloquer le CI sur des règles de style legacy.

      - name: Clones Python (plafond décroissant)
        # #1564 (02/10/2026) : aucune mesure de duplication Python n'existait —
        # 29 clones, dont sept vraies duplications, comptés à la main par l'audit.
        # `jscpd` est épinglé (le compte change d'une version à l'autre) ; le
        # plafond échoue dans les DEUX sens, pour que la marge libérée par une
        # factorisation ne serve pas à en écrire une autre. Ce qui reste est
        # déclaré dans l'en-tête de `scripts/ci/clones_python.py`.
        run: python scripts/ci/clones_python.py

  # ── Backend: tests préventifs (templates email + migrations) ─
  test-backend:
    name: Tests Python (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12" # aligné sur l'image de prod (conteneur API)

      # WeasyPrint a besoin de pango/cairo pour RENDRE un document ; sans elles,
      # `import weasyprint` échoue et les tests de rendu s'abstiendraient — donc
      # ne diraient rien. C'est le seul endroit où le rendu des documents
      # imprimables est réellement exercé (cf. api/tests/test_documents_pdf.py,
      # qui échoue exprès si ces bibliothèques manquent en intégration continue).
      #  ⚠️ N'INSTALLE RIEN dans le cas normal, et c'est pour cela qu'on regarde
      #  avant d'agir. Les cinq bibliothèques sont déjà présentes sur
      #  `ubuntu-latest` — vérifié le 19/08/2026 dans les journaux du job :
      #  « 0 upgraded, 0 newly installed, 0 to remove ». L'étape ne servait donc
      #  qu'à exécuter `apt-get update`, qui contacte les miroirs Debian :
      #  6 secondes d'habitude, **plus de dix minutes ce jour-là**, pendant que
      #  pytest attendait son tour sans avoir démarré.
      #
      #  🔴 Ne PAS supprimer l'étape pour autant. Quatre fichiers de tests rendent
      #  de vrais PDF (`test_documents_pdf`, `test_fiche_arrivant_batiments`,
      #  `test_icones_svg`, `test_pieces_jointes`) : le jour où GitHub change son
      #  image, ils échoueraient sur un défaut de bibliothèque système, avec un
      #  message que personne ne relierait à la CI. S'appuyer sur une
      #  préinstallation sans la vérifier est la dépendance implicite que
      #  `standards/04` interdit — on la rend explicite, et on ne paie
      #  l'installation que si elle manque réellement.
      - name: Bibliothèques système pour le rendu PDF
        run: bash scripts/ci/bibliotheques-pdf.sh

      - name: Install dependencies
        working-directory: api
        # `requirements-dev.txt` = la production (`-r requirements.txt`) + pytest
        # ÉPINGLÉ (#1048, 24/09/2026). Il était installé ici sans version : les
        # tests changeaient de moteur d'un run à l'autre sans que le dépôt bouge.
        run: pip install -r requirements-dev.txt

      # Licences des dépendances tierces (#1542, 02/10/2026) — front, bridge et
      # API. Ici parce que c'est le seul job où les distributions de l'API sont
      # installées. Le détail (liste blanche, exceptions, document comparé) :
      # l'en-tête de `scripts/ci/licences_tierces.py`.
      - name: Licences tierces (liste blanche, exceptions nominatives)
        run: |
          python scripts/ci/licences_tierces.py --selftest
          python scripts/ci/licences_tierces.py

      - name: Run pytest
        working-directory: api
        run: pytest tests/ -q
        env:
          SECRET_KEY: "ci-secret-key-placeholder-0123456789abcdef"
          DATABASE_URL: "sqlite:///:memory:"

  # ── Infra: syntaxe, self-tests et modes des scripts d'exploitation ─
  # Ajouté après l'incident du 30/07/2026. Les scripts d'infra (bascule,
  # failover, contrôles de fiabilité) ne passaient par AUCUN test : ils ne sont
  # ni Python ni Svelte, donc hors de portée des trois autres jobs. Or ce sont
  # eux qui décident d'arrêter la prod. Cette nuit-là, deux défauts de ce type
  # ont coûté 12 bascules croisées inutiles et un contrôle faussement vert —
  # les deux sont désormais couverts par un self-test qui échoue en CI.
  test-scripts:
    name: Scripts d'infra (syntaxe + self-tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Fins de ligne LF et absence de BOM
        # Contrôlé AVANT la syntaxe, parce qu'un CRLF ou un BOM produit un message
        # cryptique qui envoie sur une fausse piste : `syntax error near unexpected
        # token $'in\r'` pour le premier, `#!/bin/bash: command not found` pour le
        # second (le BOM est consommé comme partie du shebang). C'est un artefact de
        # clone Windows, pas une faute de frappe — il faut le nommer comme tel.
        run: |
          st=0
          for f in $(git ls-files -- '*.sh' '.githooks/*'); do
            head -c3 "$f" | grep -q $'\xef\xbb\xbf' && { echo "::error file=$f::BOM UTF-8 en tête — le shebang devient inexécutable"; st=1; }
            grep -qU $'\r$' "$f" && { echo "::error file=$f::fins de ligne CRLF — attendu LF (.editorconfig)"; st=1; }
          done
          exit $st

      - name: Le rangement des cartes du kanban ne s'écrit qu'à un endroit
        # 🔴 Signalé à l'écran le 02/09/2026 : « je n'ai pas la même vue entre le
        # fil et le calendrier pour le kanban ». Prestataire affichait 1 d'un côté
        # et 5 de l'autre, Terminé 9 contre 5.
        #
        # Le calcul « dans quelle colonne va cette carte » était écrit DEUX fois,
        # à l'identique, dans `calendrier/+page.svelte` et
        # `tableau-de-bord/+page.svelte`. Le jour où `archivee` a changé de sens
        # (#515), un seul des deux a été corrigé — et rien ne l'a dit.
        #
        # C'est le cadre #430 mot pour mot : *un objet a plusieurs rendus, et toute
        # divergence entre eux se déclare*. Celle-ci ne se déclarait nulle part et
        # n'était visible qu'en regardant les deux écrans côte à côte.
        #
        # La règle vit dans `$lib/kanban.colonneDeLEvenement`.
        #
        # 🔴 ÉTENDU le 19/09/2026 (#1030) à la TABLE DES COLONNES, et non dans un
        # second contrôle : c'est la même porte, le même défaut et la même origine
        # — un objet a plusieurs rendus, et toute divergence entre eux se déclare.
        # En écrire un deuxième aurait laissé deux contrôles à tenir d'accord pour
        # une seule règle.
        #
        # `DASH_KANBAN_COLS` recopiait les colonnes dans `KanbanTableauBord.svelte`
        # — mêmes identifiants, mêmes couleurs, mais CINQ colonnes et des libellés
        # plus courts. Et `lint:tables-statuts` était vert À CAUSE DE CELA : il
        # cherche deux tables qui partagent le même ensemble de clés, et une copie
        # INCOMPLÈTE lui échappe (cas limite de `standards/02` §1 bis).
        #
        # La table unique porte maintenant `labelCourt` et `masqueAccueil` : les
        # deux écarts étaient légitimes, aucun n'était déclaré, et une divergence
        # qui ne se déclare pas est indistinguable d'un oubli.
        run: |
          st=0
          for f in $(git ls-files -- 'front/src/**/*.svelte' 'front/src/**/*.ts'); do
            case "$f" in front/src/lib/kanban.ts) continue ;; esac
            if LC_ALL=C grep -nE 'statut_kanban\s*===\s*col(\.id)?\b' "$f" >/dev/null; then
              echo "::error file=$f::le rangement des cartes du kanban est recopié ici — employer \`colonneDeLEvenement()\` de \$lib/kanban"
              st=1
            fi
            # Une SECONDE table de colonnes : une entrée qui porte à la fois un
            # `id` de colonne connue et sa teinte. C'est la forme que prenait la
            # copie, et elle ne peut pas apparaître par hasard.
            if LC_ALL=C grep -nE "id: *'(ag|cs|syndic|fournisseur|termine|annule)'.*color:" "$f" >/dev/null; then
              echo "::error file=$f::la table des colonnes du kanban est recopiée ici — dériver \`KANBAN_COLS\` (ou \`KANBAN_COLS_ACCUEIL\`) de \$lib/kanban, et déclarer tout écart par \`labelCourt\` / \`masqueAccueil\`"
              st=1
            fi
          done
          exit $st

      - name: Aucune séquence regex avalée par un template literal
        # 🔴 LA MÊME FAMILLE QUE CI-DESSUS, ET LE CONTRÔLE PRÉCÉDENT NE PEUT PAS
        # LA VOIR (02/09/2026, quatrième occurrence).
        #
        #     new RegExp(`<${nom}\b([^>]*)>`)
        #
        # Dans un template literal, JavaScript interprète `\b` comme le caractère
        # BACKSPACE. Le motif cherche donc `<Nom␈`, qui ne correspond à rien — et
        # le contrôle qui l'emploie est vert parce qu'il ne mesure RIEN.
        #
        # ⚠️ Le fichier, lui, ne contient AUCUN octet suspect : deux caractères
        # parfaitement lisibles, transformés à l'exécution. Ni l'étape ci-dessus
        # (qui lit les octets), ni `no-control-regex` d'ESLint (qui ne voit que
        # les littéraux `/…/`), ni une relecture ne pouvaient l'attraper.
        #
        # C'est ce qui a rendu `lint:titres` inopérant depuis son écriture : il
        # est passé au vert sur le défaut même qu'il devait empêcher, signalé
        # trois fois par l'utilisateur.
        #
        # Il faut écrire `\\b` — un antislash pour le template, un pour le regex.
        run: |
          st=0
          for f in $(git ls-files -- '*.ts' '*.js' '*.mjs' '*.svelte'); do
            # Une accolade-dollar puis, dans le MÊME backtick, une séquence
            # d'échappement regex à un seul antislash. `bfnrtv0` et `\x` sont les
            # échappements que JavaScript consomme dans une chaîne.
            if LC_ALL=C grep -nE 'new RegExp\(`[^`]*[^\\]\\[bBsSwWdDnrtv0]' "$f" >/dev/null; then
              LC_ALL=C grep -nE 'new RegExp\(`[^`]*[^\\]\\[bBsSwWdDnrtv0]' "$f" | while read -r l; do
                echo "::error file=$f::séquence regex à UN antislash dans un template literal — le motif ne cherchera pas ce que vous croyez : $l"
              done
              st=1
            fi
          done
          exit $st

      - name: Absence de BOM dans le code et la configuration
        # Le contrôle ci-dessus ne couvre que les scripts shell. Or le BOM est un
        # artefact de poste Windows, pas un problème de shell : il avait déjà
        # rendu `front/package.json` illisible par Vite (CI rouge après merge), et
        # 27 fichiers versionnés en portaient encore un le 01/08/2026 — dont deux
        # sources Python, douze pages Svelte et `.gitignore`. Aucun ne cassait
        # aujourd'hui ; rien ne garantissait que le prochain ne casserait pas.
        # Les fins de ligne, elles, ne sont PAS contrôlées ici : le DÉPÔT est
        # légitimement mixte CRLF/LF hors des scripts — un FICHIER ne l'est jamais
        # (étape suivante).
        run: |
          st=0
          for f in $(git ls-files -- '*.py' '*.ts' '*.js' '*.mjs' '*.svelte' '*.json' '*.yml' '*.yaml' '*.css' '*.html' '.gitignore'); do
            head -c3 "$f" | grep -q $'\xef\xbb\xbf' && { echo "::error file=$f::BOM UTF-8 en tête — écrire ce fichier sans BOM (Set-Content -Encoding utf8 en pose un)"; st=1; }
          done
          exit $st

      - name: Aucun fichier à fins de ligne mixtes
        # Le dépôt mêle des fichiers CRLF et des fichiers LF, et c'est assumé.
        # Un FICHIER qui mêle les deux ne l'est nulle part (#1050) : c'est la
        # trace d'une édition qui a réécrit une partie des lignes avec l'autre
        # terminaison, et le prochain diff de ce fichier sera illisible. Il y en
        # avait 32 le 19/09/2026, 4 le 25/09 — normalisés dans un commit seul.
        # Ce contrôle garde le compte à zéro ; `verifier-fins-de-ligne.py`
        # (pre-commit) refuse, lui, une conversion INVOLONTAIRE.
        run: |
          #  Le chemin suit une TABULATION : couper sur les espaces tronquerait un
          #  nom qui en contient.
          mixtes=$(git ls-files --eol | awk -F '\t' '$1 ~ /^i\/mixed/ { print $2 }')
          [ -z "$mixtes" ] && exit 0
          while IFS= read -r f; do
            echo "::error file=$f::fins de ligne mixtes CRLF/LF — normaliser vers la terminaison majoritaire du fichier (commit dédié, ALLOW_EOL=1)"
          done <<< "$mixtes"
          exit 1

      - name: Aucun caractère de contrôle invisible dans le code
        # 🔴 Un caractère de RECUL (U+0008) collé au milieu d'une expression
        # régulière : invisible dans tout éditeur, il change le motif sans que
        # rien ne le montre. Trouvé une première fois par ESLint
        # (`no-control-regex`) à sa mise en service — puis DEUX fois de plus le
        # 29/08/2026, glissés en écrivant les garde-fous eux-mêmes (#419).
        #
        # ESLint ne voit que les littéraux d'expression régulière ; le piège vaut
        # pour n'importe quelle chaîne, et le motif construit par `new RegExp` en
        # est une. Ce contrôle-ci porte donc sur TOUT le texte du fichier.
        #
        # ⚠️ Tabulation, saut de ligne et retour chariot sont les seuls tolérés :
        # ce sont ceux qu'on écrit exprès.
        #
        # 🔴 TROISIÈME occurrence le 13/09/2026 (#950), toujours un U+0008 à la
        # place d'un `\b`, et cette fois DANS la règle que je venais d'ajouter à
        # `check-geste-edition` : l'expression restait valide, ne correspondait
        # plus à rien, et la règle a rendu un vert sur les quatre écrans qu'elle
        # venait elle-même de désigner comme fautifs. Ce contrôle-ci l'aurait
        # attrapée — je n'avais lancé que le lint concerné, pas la CI.
        #
        # 🔴 EN REVANCHE IL NE VOYAIT PAS LE NUL, et `check-css-duplique.mjs` en
        # portait trois depuis des mois : `grep` traite un flux contenant U+0000
        # comme binaire et se tait. Un contrôle qui ignore une partie de ce qu'il
        # annonce couvrir ment par omission (`standards/05` §9 : la portée du
        # contrôle fait partie du contrôle). On COMPTE donc les caractères
        # restants au lieu de demander à `grep` s'il en voit.
        run: |
          st=0
          for f in $(git ls-files -- '*.py' '*.ts' '*.js' '*.mjs' '*.svelte' '*.sh' '*.yml'); do
            # ⚠️ `tr -dc` et non `grep` : les trois caractères volontaires
            # (tabulation, saut de ligne, retour chariot) sont retirés, puis on
            # NE GARDE que les caractères de contrôle et on les compte. `grep`
            # rendait un faux vert sur un fichier contenant un NUL, qu'il classe
            # binaire ; `wc` ne juge pas son entrée.
            n=$(LC_ALL=C tr -d '\n\r\t' < "$f" | LC_ALL=C tr -dc '[:cntrl:]' | wc -c)
            if [ "$n" -gt 0 ]; then
              echo "::error file=$f::$n caractère(s) de contrôle invisible(s) (U+0008, U+0000 et voisins) — ils changent un motif sans se voir"
              st=1
            fi
          done
          exit $st

      - name: Syntaxe de tous les scripts shell
        run: |
          st=0
          for f in $(git ls-files -- '*.sh' '.githooks/*'); do
            bash -n "$f" || { echo "::error file=$f::erreur de syntaxe"; st=1; }
          done
          exit $st

