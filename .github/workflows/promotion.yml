name: Promotion

#  Lot DI-2 (#1754, 08/10/2026) — chantier multi-copropriétés, distribution
#  (`specs/architecture/multi-coproprietes.md` §4.10, règles 1 et 5, D11).
#
#  Promouvoir une version de `main` sur `replica`, la branche que suivent les
#  installations CoproFirst (les répliques). La référence, elle, suit `main`.
#
#  Le geste est DÉCIDÉ par l'auteur : il se lance à la main (Actions ›
#  Promotion › Run workflow, ou `gh workflow run promotion.yml -f version=X.Y.Z`).
#  Le run affiche les faits — rodage sur la référence, contrôles du commit — et
#  refuse ce qui casserait la règle : une version sans tag, hors de `main`, ou
#  qui ne serait pas en avant de `replica` (`scripts/ci/promotion.sh`).
#
#  🔒 La branche `replica` est protégée par une règle du dépôt : ni suppression,
#  ni réécriture forcée. ⚠️ « Seul ce workflow la fait avancer » n'est PAS
#  verrouillé : un dépôt personnel ne peut pas exempter GitHub Actions d'une
#  règle (`standards/08` §5 bis, constaté le 09/10/2026). C'est une consigne.
#  🔒 `api/tests/test_promotion_replica.py` tient la forme de ce fichier.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version à promouvoir (X.Y.Z, sans « v »)"
        required: true
        type: string

concurrency:
  group: promotion
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions: {}

jobs:
  promouvoir:
    name: Promouvoir ${{ inputs.version }} sur replica
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write   # avancer `replica` et publier les notes de version
      checks: read      # afficher les contrôles du commit promu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # les tags et l'historique, pour juger l'avance rapide

      #  La version passe par l'environnement, jamais interpolée dans le script :
      #  une saisie ne doit pas pouvoir s'exécuter. Le script la valide.
      - name: Décider et avancer replica
        id: promotion
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/promotion.sh

      - name: Publier les notes de version
        if: steps.promotion.outputs.verdict == 'creer' || steps.promotion.outputs.verdict == 'avancer'
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ steps.promotion.outputs.commit }}
          PRECEDENT: ${{ steps.promotion.outputs.precedent }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/notes-de-version.sh
