# =============================================================================
#  Dependabot — mises à jour de dépendances
#
#  POURQUOI cette configuration existe (04/08/2026) :
#    Sans elle, Dependabot applique ses défauts, et ses défauts ne conviennent
#    pas à ce projet. Deux problèmes constatés dès les deux premières PR :
#
#    1. ELLES VISAIENT `main`, c'est-à-dire la PRODUCTION. Or `auto-deploy.sh`
#       déploie `origin/main` toutes les 5 minutes : fusionner une PR de
#       dépendances aurait déployé sans passer par `dev`, sans pré-check, et
#       sans que le standby soit resynchronisé. Tout le flux du projet
#       court-circuité par un robot. → `target-branch: dev`.
#
#    2. ELLES GROUPAIENT TOUT ENSEMBLE. La PR pip mélangeait un correctif de
#       sécurité (`python-multipart` 0.0.19 → 0.0.31, analyseur de
#       téléversement) avec un saut de version MAJEURE de Pillow (11 → 12) et
#       SIX versions majeures de WeasyPrint (63 → 69), moteur des documents
#       imprimables. La PR était VERTE — parce qu'aucun test ne rend un PDF.
#       Un correctif de sécurité qu'on ne peut pas fusionner sans embarquer
#       deux sauts majeurs non vérifiés, c'est un correctif qu'on repousse.
#
#  D'OÙ LE DÉCOUPAGE CI-DESSOUS : les mises à jour mineures et correctives sont
#  groupées (peu risquées, fusionnables d'un bloc) ; les MAJEURES arrivent
#  SEULES, chacune dans sa PR, parce que chacune mérite d'être regardée et
#  qu'une majeure noyée dans un groupe de douze ne l'est jamais.
#
#  UNE EXCEPTION, apprise le soir même : une FAMILLE COORDONNÉE ne peut pas se
#  juger paquet par paquet, parce que ses membres se contraignent mutuellement
#  et qu'une PR isolée n'arrive même pas à s'installer. Voir les groupes
#  `tiptap` et `chaine-svelte` plus bas — ils passent AVANT les groupes par type
#  de mise à jour, Dependabot retenant le premier groupe qui reconnaît un paquet.
#
#  ✅ Mis à jour le 04/08/2026 au soir : le contrôle de rendu manquant existe
#  désormais (`api/tests/test_documents_pdf.py`, avec pango/cairo installés dans
#  le job). Il a immédiatement fait son travail : Pillow 12 et WeasyPrint 69 ont
#  été acceptés parce qu'ils rendent réellement une fiche arrivant et une annonce
#  de hall — pas parce que leur CI était verte.
# =============================================================================
version: 2

updates:
  # ── Backend Python ─────────────────────────────────────────────────────────
  - package-ecosystem: pip
    directory: /api
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-mineur:
        applies-to: version-updates
        update-types: [minor, patch]
      python-securite:
        applies-to: security-updates
        update-types: [minor, patch]
    # Les majeures ne figurent dans aucun groupe : Dependabot leur ouvre donc
    # une PR chacune, ce qui est exactement le but. Rien à déclarer pour ça.
    #
    #  SQLModel 0.0.45+ n'est plus ignoré (#1412, 28/09/2026) : les dates des
    #  modèles sont annotées `NaiveDatetime`, et `test_horloge.py` refuse toute
    #  colonne de date consciente du fuseau.
    ignore:
      #  ── SQLAlchemy 2.1 : IMPOSSIBLE tant que sqlmodel l'exclut (#1480) ──
      #  Mesuré le 30/09/2026 : sqlmodel 0.0.47 exige « SQLAlchemy<2.1.0 ».
      #  #1429 proposait 2.1.1 à côté de lui — une paire que pip refuse de
      #  résoudre. Condition de levée, par commande et non par date :
      #    pip download --no-deps -d /tmp/s sqlmodel
      #    unzip -p /tmp/s/sqlmodel-*.whl '*/METADATA' | grep SQLAlchemy
      #  → dès que la borne haute admet 2.1, retirer cette règle et monter les
      #  deux ensemble (relire alors les notes de passage de SQLAlchemy 2.1).
      - dependency-name: sqlalchemy
        versions: [">=2.1.0"]

  # ── Frontend npm ───────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /front
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      #  ⚠️ LES FAMILLES COORDONNÉES D'ABORD — Dependabot affecte une dépendance
      #  au PREMIER groupe qui la reconnaît. Déclarées après les groupes par
      #  type de mise à jour, elles n'attraperaient jamais rien.
      #
      #  Pourquoi elles existent (04/08/2026) : la règle « une majeure = une PR »
      #  rend chaque saut jugeable — sauf pour un ensemble dont les paquets se
      #  contraignent mutuellement. #253 montait `@tiptap/core` seul en 3.29.2 :
      #      Found: @tiptap/pm@2.27.2
      #        peer @tiptap/pm@"^2.7.0"  from @tiptap/extension-placeholder@2.27.2
      #        peer @tiptap/pm@"3.29.2"  from @tiptap/core@3.29.2
      #  npm n'arrivait même pas à installer (ERESOLVE) : la PR ne pouvait pas
      #  être jugée, elle ne pouvait qu'échouer. Tiptap épingle ses pairs à la
      #  version EXACTE — même un correctif isolé casserait. Ces paquets bougent
      #  donc ensemble, quel que soit le type de mise à jour.
      tiptap:
        patterns: ["@tiptap/*"]
      #  Même raison pour la chaîne de construction : #252 (Vite 6 → 8) échouait
      #  aussi en ERESOLVE, la plage de pairs de SvelteKit ne l'admettant pas.
      chaine-svelte:
        patterns: ["vite", "@sveltejs/*", "vite-plugin-*", "svelte", "svelte-check"]
      npm-mineur:
        applies-to: version-updates
        update-types: [minor, patch]
      npm-securite:
        applies-to: security-updates
        update-types: [minor, patch]
    ignore:
      #  ══ MIGRATIONS, PAS DES MONTÉES DE VERSION (décidé le 04/08/2026) ══
      #
      #  Ces majeures ne sont pas « en attente d'être fusionnées » : elles sont
      #  impossibles telles quelles. Les laisser ouvertes produisait quatre PR
      #  rouges permanentes que Dependabot recréait chaque lundi, et du rouge
      #  permanent finit par ne plus être lu — c'est un contrôle qui s'éteint.
      #  Chaque règle porte donc SA CONDITION DE LEVÉE, vérifiable par une
      #  commande, jamais par une date ni par une compatibilité annoncée.
      #
      #  ── Chaîne Vite/Svelte : LEVÉE le 24/10/2026 (#2205) ─────────────────
      #  Les règles `ignore` de `vite` et de `@sveltejs/vite-plugin-svelte`
      #  avaient été posées le 04/08/2026 sur ce constat : « Vite 8 compile,
      #  mais plus AUCUNE référence à `/sw.js` dans le bundle — le service
      #  worker n'est plus enregistré ». C'était un FAUX NÉGATIF du contrôle,
      #  pas une régression : Rolldown (Vite 8) écrit ses chaînes en gabarits à
      #  accents graves (`/sw.js` entre accents graves), et `lint:sw` comme
      #  l'extracteur de P3 ne connaissaient que les guillemets. L'enregistrement
      #  était là, en URL absolue. Mesuré depuis dans un navigateur :
      #  `npm run e2e:sw` lance l'application construite et exige un service
      #  worker activé, de portée `/` — avec un cas zéro (service workers
      #  bloqués → refus) et une mutation éprouvée.
      #  Les deux contrôles lisent désormais les trois guillemets, `--selftest`
      #  compris. Leçon générique : `~/.claude/standards/04` §15 — un contrôle qui
      #  lit la FORME d'un artefact se casse à chaque changement de l'outil qui
      #  l'émet ; le comportement prime.
      #
      #  ── SvelteKit 3 : LEVÉE le 28/10/2026 (#2205, lot 3) ─────────────────
      #  La règle `ignore` de `@sveltejs/kit` (majeure) a été posée parce que la
      #  montée n'était pas une montée de lock : `svelte.config.js` disparaît,
      #  `$app/stores`, `$app/environment` et `$env/*` sont retirés, `ORIGIN`
      #  d'adapter-node n'existe plus, les matcheurs changent de forme, et le
      #  build casse dans `vite-plugin-pwa`. Tout cela est fait : la règle ne
      #  protégeait plus rien et aurait masqué la majeure suivante.
      #
      #  ── Tiptap 2 → 3 : LEVÉE (23/09/2026, #1161) ─────────────────────────
      #  La migration est faite (`@tiptap/*` en ^3.31) : la règle ne protégeait
      #  plus rien et aurait masqué la majeure suivante (3 → 4). Le groupe
      #  `tiptap` ci-dessus garde les paquets ensemble.
      #
      #  ── TypeScript 7 : refusé par SvelteKit ──────────────────────────────
      #  `@sveltejs/kit@2.70.2` déclare `typescript: "^5.3.3 || ^6.0.0"`.
      #  TypeScript 6 reste donc autorisé — d'où `versions` et non
      #  `semver-major`, pour ne pas bloquer une majeure qui, elle, passerait.
      #  LEVÉE : quand une version de @sveltejs/kit admet `^7.0.0`.
      - dependency-name: "typescript"
        versions: [">= 7"]

  # ── Bridge WhatsApp (npm) — ajouté le 25/09/2026 (#1050) ───────────────────
  # Il n'était suivi par RIEN : `baileys`, `express`, `pino` et `qrcode` ne
  # recevaient ni correctif ni alerte de sécurité, alors que le bridge tient
  # la session WhatsApp du compte et reçoit des requêtes de l'API.
  #
  # ⚠️ Baileys parle un protocole NON OFFICIEL : une mineure peut suffire à
  # rompre la connexion. Les majeures arrivent donc seules (règle commune), et
  # une PR du bridge ne se juge qu'après un envoi réel constaté — aucun test
  # de la CI ne traverse WhatsApp (#1057).
  - package-ecosystem: npm
    directory: /whatsapp-bridge
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      bridge-mineur:
        applies-to: version-updates
        update-types: [minor, patch]
      bridge-securite:
        applies-to: security-updates
        update-types: [minor, patch]
    #  Le contrat HTTP du bridge (clé, plafond du corps, codes de réponse) est
    #  testé en CI depuis le 27/09/2026, Baileys simulé
    #  (`whatsapp-bridge/tests/`) : une montée d'express ou de pino se juge sur
    #  lui. Une montée de Baileys, toujours sur un envoi réel.
    ignore:
      #  ── Pino 10 : pas tant que Baileys exige ^9 (27/09/2026, #1287) ──────
      #  `baileys@6.7` déclare `pino: ^9.6` et reçoit NOTRE instance de journal.
      #  Monter pino seul installe deux pino, et fait tenir à Baileys un objet
      #  d'une majeure qu'il ne déclare pas — pour un gain nul : pino 10 ne fait
      #  que retirer Node 18, que personne ici n'utilise.
      #  LEVÉE : quand `npm view baileys@latest dependencies.pino` admet ^10.
      - dependency-name: "pino"
        update-types: ["version-update:semver-major"]

  # ── Images de base Docker — ajouté le 25/09/2026 (#1050) ──────────────────
  # Les quatre images (`api`, `front`, `whatsapp-bridge`, Caddy à la racine)
  # portent le système et l'interpréteur de chaque conteneur : une faille de
  # Node, de Python ou d'Alpine n'arrivait jusqu'ici que par hasard, au
  # prochain `docker compose build` qui tirait une étiquette flottante.
  - package-ecosystem: docker
    directories: ["/api", "/front", "/whatsapp-bridge", "/"]
    target-branch: dev
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"

  # ── Images du compose qui ne se construisent pas — ajouté le 12/10/2026 (#1872)
  # `postgres:17.11` est déclaré par `image:` dans `docker-compose.yml`, sans
  # Dockerfile : le bloc `docker` ci-dessus ne le lit pas, et aucune mineure
  # (17.12…) n'était proposée. L'écosystème `docker-compose` lit les `image:` des
  # compose du répertoire (mises à jour de version seulement : pas d'alertes de
  # sécurité pour lui). Les correctifs republiés sous la MÊME étiquette arrivent,
  # eux, par le re-tirage du dimanche (`maintenance.sh`, `lib-images-base.sh`).
  # 🔒 `api/tests/test_images_compose_suivies.py` : une image du compose que ni
  # le re-tirage ni ce bloc ne suivent fait échouer la CI.
  #
  # ⚠️ Une PR de mineure PostgreSQL change l'image des DEUX nœuds : le primaire
  # la prend à la bascule, la réplique à sa recréation — même majeure, même
  # format de données. Aligner `postgresql.yml` (la CI) dans la même PR : le test
  # ci-dessus le refuse sinon.
  - package-ecosystem: docker-compose
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
    ignore:
      #  ── PostgreSQL : jamais de majeure par une PR (12/10/2026, #1872) ──────
      #  Une majeure change le FORMAT des données : l'image 18 refuse de démarrer
      #  sur un volume initialisé en 17, et la réplique du standby avec elle. La
      #  montée est une MIGRATION (`pg_upgrade` ou export/import, sur les deux
      #  nœuds, la réplique reconstruite), pas un changement d'étiquette.
      #  Cette règle ne se lève pas : la majeure suivante se fait dans un lot à
      #  elle, qui change l'étiquette à la main.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]

  # ── Actions GitHub ─────────────────────────────────────────────────────────
  # Une action figée sur une version vulnérable a accès au dépôt et aux
  # secrets du workflow : elle mérite le même suivi que le code.
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
