#  🔴 Budget d’une photo jointe à un message WhatsApp, en kio — ÉCRIT UNE FOIS.
#
#  Deux services le lisent : l’API réduit la photo pour tenir dessous, le
#  bridge en dérive la borne de son corps JSON (le double : la base64 coûte
#  4/3, le reste couvre le texte). Tant que ce nombre n’existait pas, le
#  bridge gardait le plafond par défaut d’express — 100 kio — et refusait par
#  413 tout message portant une photo : ils étaient perdus sans un mot
#  (#1057, 19/09/2026). Deux nombres écrits séparément divergeraient, et
#  c’est l’écart entre eux qui coûte le message.
x-budget-photo-whatsapp: &budget_photo_whatsapp "WA_PHOTO_BUDGET_KO=400"

services:
  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    container_name: hostachy_caddy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    ports:
      - "80:80"
    environment:
      - TZ=Europe/Paris
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy # journal d'accès anonyme, survit aux déploiements (#1588)
      - uploads:/srv/uploads:ro
    depends_on:
      - front
      - api
    networks:
      - hostachy

  front:
    build:
      context: ./front
      dockerfile: Dockerfile
      args:
        GIT_HASH: ${GIT_HASH:-dev}
    container_name: hostachy_front
    labels:
      - "git.hash=${GIT_HASH:-dev}"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    environment:
      - NODE_ENV=production
      - PUBLIC_API_URL=http://api:8000
      # Le nœud qui sert (« RPi1 » au pied de page), lu à l'EXÉCUTION et non
      # gravé au build : une même image sert les deux nœuds, et les images
      # viennent de la CI, qui ne sait pas où elles tourneront (#1758).
      - PUBLIC_INSTANCE_ID=${INSTANCE_ID:-}
      # PAS d'ORIGIN pour le front depuis SvelteKit 3 (#2205) : adapter-node 6 ne
      # la lit plus. L'adresse des pages se déduit de l'en-tête Host que Caddy
      # transmet tel quel — le nom public sur l'actif, l'IP locale sur le standby —,
      # sans réglage par rôle. `ORIGIN` du .env reste celui de l'API (#1751).
      - TZ=Europe/Paris
    depends_on:
      - api
    networks:
      - hostachy

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      args:
        GIT_HASH: ${GIT_HASH:-dev}
    container_name: hostachy_api
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    env_file: .env
    environment:
      - TZ=Europe/Paris
      - *budget_photo_whatsapp
    #  🔴 PAS de `depends_on: postgres` : `up -d api` démarrerait alors la base
    #  si elle est arrêtée — une base VIDE sur un nœud sans réplique (CLAUDE.md,
    #  règle d'or). L'API attend la base elle-même (`start.sh`, `attendre_base`).
    volumes:
      #  `app_data` : l'identité de l'installation au registre et le cache du
      #  manuel PDF — jamais la base.
      - app_data:/app/data
      - uploads:/app/uploads
      - backups:/backups
    networks:
      - hostachy

  #  🐘 PostgreSQL — la base de l'application (DI-7 #1759, D4, D13 : un seul
  #  moteur partout). Il fait partie de la pile : `docker compose up -d` le
  #  démarre, et l'API s'y branche par `DATABASE_URL`.
  #
  #  Réglages DOUX POUR LA CARTE SD (arbitrage du 09/10/2026) : points de contrôle
  #  espacés (`checkpoint_timeout`, `max_wal_size`) et journal compressé — moins
  #  d'écritures, sans rien céder sur la durabilité (`fsync` et
  #  `synchronous_commit` restent à leur défaut, ACTIFS). `wal_level=replica` et
  #  `max_wal_senders` préparent la réplication en continu vers le standby (DI-7b).
  #
  #  Le port n'est lié qu'à `PG_ECOUTE` — l'IP du LAN du nœud, posée dans son
  #  `.env` pour la réplication en continu vers l'autre Pi (DI-7b) ; 127.0.0.1
  #  sinon, donc fermé au réseau. Jamais à toutes les interfaces. Qui peut s'y
  #  connecter, et comment : `infra/postgresql/pg_hba.conf` (scram partout, la
  #  réplication depuis l'autre nœud seulement).
  #  🔴 Pas de mot de passe par défaut (#776) : sans `POSTGRES_PASSWORD`, l'image
  #  REFUSE d'initialiser la base — elle ne démarre pas avec un secret connu ; sans
  #  `PG_REPLICATION_PASSWORD`, `initdb/10-replication.sh` refuse aussi.
  #  `wal_keep_size` : le journal gardé pour une réplique qui a pris du retard —
  #  BORNÉ, plutôt qu'un emplacement de réplication qui le retiendrait sans limite
  #  sur la carte SD si la réplique s'arrêtait.
  postgres:
    image: postgres:17.11
    container_name: hostachy_postgres
    restart: unless-stopped
    stop_grace_period: 60s
    shm_size: 256mb
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - TZ=Europe/Paris
      - POSTGRES_USER=coprofirst
      - POSTGRES_DB=coprofirst
      #  Sommes de contrôle de PAGES : PostgreSQL vérifie chaque page lue, et
      #  `dialecte.verifier_integrite` en lit le compteur d'échecs — l'intégrité
      #  se MESURE (sans elles, une page abîmée sur la carte SD passerait muette).
      #  Ne se pose qu'à l'initialisation : une réplique les hérite de la copie.
      - POSTGRES_INITDB_ARGS=--data-checksums
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-}
      - PG_REPLICATION_PASSWORD=${PG_REPLICATION_PASSWORD:-}
    ports:
      - "${PG_ECOUTE:-127.0.0.1}:5432:5432"
    command:
      - postgres
      - -c
      - checkpoint_timeout=15min
      - -c
      - max_wal_size=1GB
      - -c
      - wal_compression=on
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=4
      - -c
      - shared_buffers=256MB
      - -c
      - wal_keep_size=512MB
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgresql/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./infra/postgresql/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coprofirst -d coprofirst"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - hostachy

  whatsapp-bridge:
    build:
      context: ./whatsapp-bridge
      dockerfile: Dockerfile
    container_name: hostachy_whatsapp
    restart: unless-stopped
    # Arrêt propre (#1590) : le bridge ferme son socket et finit ses écritures
    # d'état d'authentification sur SIGTERM, bornées à 8 s (`arret.js`). Sans ce
    # délai, Docker tuait à 10 s (exit 137) ; ici, il laisse le bridge sortir.
    # Strictement SUPÉRIEUR au minuteur du bridge : `tests/livraison.test.js`.
    stop_grace_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      - TZ=Europe/Paris
      #  🔴 PAS DE SECRET PAR DÉFAUT (#776, 05/09/2026). `:-changeme` laissait le
      #  bridge démarrer SANS ERREUR quand `.env` perdait la variable — et
      #  `SECRET_KEY`, elle, refuse de démarrer depuis toujours (`config.py`).
      #  Le même défaut, deux traitements : `:?` aligne le second sur le premier.
      - WA_API_KEY=${WHATSAPP_API_KEY:?WHATSAPP_API_KEY manquante dans .env}
      - WA_PORT=8090
      - WA_AUTH_DIR=/app/auth_state
      - WA_LOG_LEVEL=warn
      - *budget_photo_whatsapp
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - whatsapp_auth:/app/auth_state
    networks:
      - hostachy

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
  app_data:
  uploads:
  backups:
  whatsapp_auth:
  pg_data:

networks:
  hostachy:
    driver: bridge
