#  Conformité REUSE — la licence de chaque fichier, en un endroit.
#
#  🔴 UN SEUL MOTIF, ET C'EST VOULU (05/09/2026, #774). La conversion depuis
#  `.reuse/dep5` en avait produit DOUZE : `**`, puis `docs/**`, `specs/**`,
#  `front/static/**`, `**.md`, `**.json`, `**.yml`… tous avec le même
#  propriétaire et la même licence. `**` les couvre déjà tous — les onze autres
#  étaient de la duplication pure, héritée d'un format qui listait les
#  répertoires un par un.
#
#  Douze écritures d'une même règle, c'est douze occasions de corriger la
#  licence à onze endroits sur douze le jour où elle change.
#
#  ⚠️ Le format `dep5` qui les portait est DÉPRÉCIÉ depuis REUSE 3.2 : garder un
#  format que l'outil cessera de lire, c'est programmer la panne du contrôle
#  qu'on vient de poser en intégration continue.
#
#  ⚠️ Une exception future — une image sous une autre licence, une bibliothèque
#  tierce embarquée — s'ajoute en bloc SUPPLÉMENTAIRE, plus précis que `**`.
#  C'est le seul cas où un second bloc dit quelque chose que le premier ne dit
#  pas ; sinon, il le répète.
version = 1
SPDX-PackageName = "CoproFirst"
SPDX-PackageSupplier = "https://github.com/philippe-tressard/coprofirst/issues"
SPDX-PackageDownloadLocation = "https://github.com/philippe-tressard/coprofirst"

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Philippe TRESSARD"
SPDX-License-Identifier = "AGPL-3.0-or-later"

#  ── Contenus repris de projets tiers (#1543, 02/10/2026) ──────────────────
#  Les blocs ci-dessous sont les « exceptions futures » annoncées en tête : des
#  fichiers qui mêlent l'œuvre du projet et des tracés d'icônes recopiés.
#  Jusqu'ici, `**` leur attribuait la seule licence du projet et `reuse lint`
#  restait vert — il vérifie qu'une licence est DÉCLARÉE, pas qu'elle est vraie.
#
#  ⚠️ Le titulaire du projet y est RÉPÉTÉ, et c'est voulu : quand plusieurs
#  blocs correspondent au même fichier, REUSE retient le DERNIER, il ne les
#  cumule pas. Sans cette ligne, le fichier perdrait la mention du projet.
#
#  La source de vérité de ce qui est repris, d'où et sous quelle licence est
#  `scripts/ci/licences_politique.py` (CONTENUS_TIERS) ; `contenus_tiers.py`
#  échoue si ces blocs ne lui correspondent plus, ou si un autre fichier
#  recopie un tracé du catalogue sans y être déclaré.

#  Le catalogue d'icônes et sa copie côté API (tenus égaux à l'octet par
#  `test_icones_svg.py`) : Lucide (ISC ; MIT pour la part issue de Feather),
#  le logo WhatsApp de Simple Icons (CC0-1.0), et l'icône `stairs`.
[[annotations]]
path = ["front/src/lib/icones-svg.json", "api/app/utils/icones-svg.json"]
precedence = "override"
SPDX-FileCopyrightText = [
  "2026 Philippe TRESSARD",
  "2026 Lucide Icons and Contributors",
  "2013-present Cole Bemis",
]
SPDX-License-Identifier = "AGPL-3.0-or-later AND ISC AND MIT AND CC0-1.0"

#  ── Le logo de CoproFirst, hors de l'AGPL (#1736, 10/10/2026) ─────────────
#  Une œuvre du projet, mais pas sous sa licence : sous l'AGPL, n'importe qui
#  pouvait signer une version modifiée du logo d'origine. Ce qui est permis se
#  lit dans `LICENSES/LicenseRef-CoproFirst-Logo.txt`, et la politique dans
#  `MARQUE.md`. Un rendu de plus du logo s'ajoute ICI, sinon `**` le rend libre.
[[annotations]]
path = [
  "front/static/favicon.svg",
  "front/static/icons/icon-192.png",
  "front/static/icons/icon-512.png",
  "api/app/utils/logo-neutre.svg",
  "api/app/utils/logo-neutre.png",
  "api/app/utils/logo-neutre-sombre.svg",
  "api/app/utils/logo-neutre-sombre.png",
  "docs/images/coprofirst.png",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Philippe TRESSARD"
SPDX-License-Identifier = "LicenseRef-CoproFirst-Logo"

#  Le manuel utilisateur (deux exemplaires) et la page de maintenance
#  Cloudflare : texte du projet, pictogrammes Lucide en SVG en ligne.
[[annotations]]
path = [
  "docs/manuel-utilisateur.html",
  "front/static/manuel-utilisateur.html",
  "infra/cloudflare-worker.js",
]
precedence = "override"
SPDX-FileCopyrightText = [
  "2026 Philippe TRESSARD",
  "2026 Lucide Icons and Contributors",
  "2013-present Cole Bemis",
]
SPDX-License-Identifier = "AGPL-3.0-or-later AND ISC AND MIT"
