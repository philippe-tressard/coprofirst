# Configuration pytest de l'API (#1604, 02/10/2026).
#
# `python_files` n'était déclaré nulle part : pytest retombait sur son motif par
# défaut, `test_*.py` ET `*_test.py`. Un module d'AIDE nommé `purge_test.py`
# était donc collecté comme s'il portait des tests (zéro, en l'occurrence) — et
# le prochain nommé ainsi l'aurait été aussi. Un fichier de tests s'appelle
# `test_*.py` ; une aide partagée, `aides_*.py` (CLAUDE.md, « le code de test ne
# se recopie pas »).
[pytest]
python_files = test_*.py
